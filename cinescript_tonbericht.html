/* ═══════════════════════════════════════════════════════════════
   FAB — Floating Action Button (mobil)
   Tippt man ihn an, wechselt er zwischen den drei Modi:
   Normal (✱) → Dialog-Marker (🎙) → Geräusch-Marker (🔊) → Normal
═══════════════════════════════════════════════════════════════ */
const FAB_CYCLE=[null,'d','g','w'];
function cycleFAB(){
  const i=FAB_CYCLE.indexOf(S.mode);
  setMode(FAB_CYCLE[(i+1)%FAB_CYCLE.length]);
}
function updateFAB(){
  const btn=g('fab-btn'),lbl=g('fab-label');
  if(!btn)return;
  if(S.mode==='d'){
    btn.textContent='🎙';btn.className='d';
    lbl.textContent='Dialog-Marker aktiv';lbl.classList.add('on');
  }else if(S.mode==='g'){
    btn.textContent='🔊';btn.className='g';
    lbl.textContent='Geräusch-Marker aktiv';lbl.classList.add('on');
  }else if(S.mode==='w'){
    btn.textContent='✏';btn.className='w';
    lbl.textContent='Wort-Marker aktiv';lbl.classList.add('on');
  }else{
    btn.textContent='✱';btn.className='';
    lbl.textContent='';lbl.classList.remove('on');
  }
}

/* ═══════════════════════════════════════════════════════════════
   ACTION SHEET — erscheint nach Long Press auf Dialogzeile
   Ersetzt Tastatur-Shortcuts auf mobilen Geräten vollständig.
═══════════════════════════════════════════════════════════════ */
function showAS(scene,line){
  const sc=as();if(!sc)return;
  const isRec=!!sc.recorded[line.id];
  const isNt=(sc.nurtons||[]).some(n=>n.lineId===line.id);
  /* Haptisches Feedback (iOS/Android) */
  if(navigator.vibrate)navigator.vibrate(38);
  /* Titel = Anfang des Dialogtexts */
  g('as-title').textContent=line.text.length>55?line.text.slice(0,52)+'…':line.text;
  const items=[
    {
      label:isRec?'✕  Aufnahme-Markierung entfernen':'✓  Als aufgenommen markieren',
      color:isRec?'var(--red)':'var(--green)',
      action:()=>{togRec(line.id);hideAS();}
    },
    {
      label:isNt?'🎙  Von Nurton-Liste entfernen':'🎙  Zu Dialog-Nurtönen hinzufügen',
      color:'var(--blue)',
      action:()=>{addNtDialog(scene,line);hideAS();}
    },
    {
      label:'🔊  Geräusch erfassen',
      color:'var(--green)',
      action:()=>{hideAS();setTimeout(()=>addNtGerausch(scene,line),340);}
    },
    ...(lineHasWordMarkers(line.id)?[{
      label:'✏  Alle Wort-Marker dieser Zeile löschen',
      color:'var(--orange)',
      action:()=>{clearLineWordMarkers(line.id);hideAS();}
    }]:[])
  ];
  const cont=g('as-items');cont.innerHTML='';
  items.forEach(item=>{
    const btn=mk('button','as-item');
    btn.textContent=item.label;btn.style.color=item.color;
    btn.onclick=item.action;cont.appendChild(btn);
  });
  g('as-overlay').classList.add('on');
  /* Double rAF: sicherstellt dass display:flex gesetzt ist bevor Transition startet */
  requestAnimationFrame(()=>requestAnimationFrame(()=>g('as-sheet').classList.add('open')));
}
function hideAS(){
  g('as-sheet').classList.remove('open');
  setTimeout(()=>g('as-overlay').classList.remove('on'),340);
}

/* ═══════════════════════════════════════════════════════════════
   LONG PRESS — Touch-Helper
   Erkennt langen Tastendruck (480ms) mit Abbruch bei Bewegung.
═══════════════════════════════════════════════════════════════ */
function attachLP(el,cb){
  let t=null,moved=false;
  el.addEventListener('touchstart',()=>{
    moved=false;
    t=setTimeout(()=>{if(!moved)cb();},480);
  },{passive:true});
  el.addEventListener('touchmove',()=>{moved=true;clearTimeout(t);},{passive:true});
  el.addEventListener('touchend',()=>clearTimeout(t));
  el.addEventListener('touchcancel',()=>clearTimeout(t));
}

/* KEYBOARD (desktop) */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){g('srch').focus();return;}
  if(e.key==='Escape'){
    g('srch').value='';S.ui.q='';
    if(S.mode){S.mode=null;resetModeUI();}
    renderScript();closeSidebar();return;
  }
  if(e.key==='1')setMode('d');
  if(e.key==='2')setMode('g');
  if(e.key==='3')setMode('w');
});

/* Close sidebar when clicking content on mobile */
g('main').addEventListener('click',()=>{if(isMobile())closeSidebar();},{passive:true});

/* ═══════════════════════════════════════════════════════════════
   PWA SETUP — Service Worker + Install-Banner
═══════════════════════════════════════════════════════════════ */
(function pwaSetup(){

  /* ── Service Worker registrieren ───────────────────────────── */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(reg=>{
        /* Neue Version verfügbar → Nutzer informieren */
        reg.addEventListener('updatefound',()=>{
          const nw=reg.installing;
          nw.addEventListener('statechange',()=>{
            if(nw.state==='installed'&&navigator.serviceWorker.controller){
              showToast('Update verfügbar – App neu laden für die neue Version','ok');
            }
          });
        });
      })
      .catch(()=>{
        /* Fehler nur bei file:// — App funktioniert trotzdem online */
      });
  }

  /* ── iOS Install-Banner ─────────────────────────────────────── */
  const isInstalled=window.navigator.standalone===true
    ||window.matchMedia('(display-mode: standalone)').matches;
  const dismissed=localStorage.getItem('cs_install_dismissed');

  if(!isInstalled&&!dismissed&&/iphone|ipad|ipod/i.test(navigator.userAgent)){
    setTimeout(()=>{
      const banner=document.createElement('div');
      banner.id='install-banner';
      banner.style.cssText=`
        position:fixed;bottom:calc(var(--tb) + 12px + var(--sb));left:12px;right:12px;
        background:#1c1c1e;border-radius:16px;padding:14px 16px;
        box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:300;
        display:flex;align-items:flex-start;gap:12px;
        border:0.5px solid rgba(255,255,255,.1);
        animation:slideUp .4s cubic-bezier(.32,0,.22,1);
      `;
      banner.innerHTML=`
        <div style="font-size:32px;flex-shrink:0">🎬</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:3px">CineScript installieren</div>
          <div style="font-size:12px;color:rgba(235,235,245,.55);line-height:1.5">
            Tippe <strong style="color:rgba(235,235,245,.8)">Teilen ↑</strong> und dann
            <strong style="color:rgba(235,235,245,.8)">„Zum Home-Bildschirm"</strong>
            — danach läuft die App offline.
          </div>
        </div>
        <button id="install-close" style="background:none;border:none;color:rgba(235,235,245,.4);font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0">✕</button>
      `;
      document.body.appendChild(banner);
      document.getElementById('install-close').onclick=()=>{
        banner.remove();localStorage.setItem('cs_install_dismissed','1');
      };
      setTimeout(()=>{if(banner.parentNode)banner.remove();},14000);
    },1800);
  }
})();
