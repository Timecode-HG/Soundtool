<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- ── PWA / iOS App-Installation ─────────────────────────────
     Safari: Teilen → „Zum Home-Bildschirm" → installiert als App
     Verhält sich danach wie eine native App: kein Browser-Chrome,
     eigenes Icon, Vollbild, offline nutzbar.
──────────────────────────────────────────────────────────────── -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineScript">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="CineScript">
<meta name="theme-color" content="#000000">
<meta name="description" content="Set-Drehbuch Manager — Aufnahmen tracken, Nurtöne erfassen">

<!-- Web App Manifest -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png" id="favicon">

<!-- iOS Splash Screens -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>CineScript</title>
<!-- PDF.js wird nicht mehr im <head> geladen — das blockierte Safari
     bei fehlendem Internet. Stattdessen lazy-loading beim ersten PDF-Import. -->
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg0:#000;--bg1:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--bg4:#48484a;
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--label4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.65);--sep-o:#38383a;
  --fill1:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.22);--fill3:rgba(118,118,128,.18);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40cbe0;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --mono:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --r8:8px;--r10:10px;--r12:12px;--r16:16px;--r20:20px;
  --shadow:0 2px 16px rgba(0,0,0,.5);--shadow-lg:0 8px 40px rgba(0,0,0,.65);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --nb:52px;--tb:83px;--sw:290px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,[onclick]{touch-action:manipulation;cursor:pointer;}
button{-webkit-appearance:none;}
html{height:100%}
body{
  height:100%;overflow:hidden;
  background:var(--bg0);color:var(--label);
  font-family:var(--font);font-size:16px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--fill1);border-radius:2px}

/* ── LOADING ────────────────────────────────────────────────── */
#loading{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
#loading.on{display:flex}
#loading p{font-size:13px;color:var(--label2);letter-spacing:.04em;margin-top:4px}
.spin{width:36px;height:36px;border:2px solid var(--fill1);border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── TOAST ──────────────────────────────────────────────────── */
#toast{
  display:none;position:fixed;bottom:calc(var(--tb) + 12px + var(--sb));left:50%;
  transform:translateX(-50%);z-index:900;
  background:var(--bg3);border-radius:var(--r12);padding:11px 20px;
  font-size:14px;font-weight:500;white-space:nowrap;
  box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;
}
@media(min-width:768px){
  #toast{left:auto;right:20px;transform:none;bottom:20px}
}
#toast.on{display:block}
#toast.ok{color:var(--green)}
#toast.warn{color:var(--orange)}
#toast.err{color:var(--red)}

/* ── MODAL ──────────────────────────────────────────────────── */
#movl{display:none;position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
@media(min-width:768px){#movl{align-items:center}}
#movl.on{display:flex}
#modal{
  background:var(--bg2);width:100%;max-width:480px;
  border-radius:var(--r20) var(--r20) 0 0;
  padding:20px 20px calc(20px + var(--sb)) 20px;
  max-height:85vh;overflow-y:auto;
}
@media(min-width:768px){
  #modal{border-radius:var(--r20);padding:28px;max-height:70vh}
}
#modal h3{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--label)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.crow:last-child{border-bottom:none}
.crow span{font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow input[type=color]{width:38px;height:34px;border:none;border-radius:var(--r8);cursor:pointer;padding:2px;background:none;-webkit-appearance:none}
/* ── Rollen-Merge-Panel ─────────────────────────────────────── */
.merge-section{margin-bottom:18px;border-bottom:1px solid var(--sep);padding-bottom:16px}
.merge-section h4{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--label3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.merge-group{
  background:var(--fill2);border-radius:var(--r10);padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--sep);
}
.merge-group-names{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.merge-name-badge{
  border-radius:var(--r20);padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--sep);background:var(--fill3);color:var(--label2);transition:.15s;
  display:flex;align-items:center;gap:4px;
}
.merge-name-badge.canonical{background:rgba(10,132,255,.15);color:var(--blue);border-color:var(--blue)}
.merge-name-badge .crown{font-size:10px}
.merge-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.merge-confirm-btn{
  background:var(--blue);color:#fff;border:none;border-radius:var(--r8);
  font-size:13px;font-weight:600;padding:7px 16px;cursor:pointer;min-height:34px;
  font-family:var(--font);transition:opacity .15s;white-space:nowrap;
}
.merge-confirm-btn:active{opacity:.75}
.merge-confirm-btn.destr{background:var(--red)}
.merge-manual{
  margin-top:6px;background:var(--fill2);border-radius:var(--r10);
  padding:10px 12px;border:1px solid var(--sep);
}
.merge-manual select{
  background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label);
  padding:6px 10px;font-size:13px;font-family:var(--font);outline:none;flex:1;min-width:0;
}
.merge-hint{font-size:11px;color:var(--label3);margin-top:5px}

/* ── APP SHELL ──────────────────────────────────────────────── */
/* position:fixed + --dvh ist das zuverlässigste Muster für
   Vollbild-Webanwendungen auf iOS Safari.
   --dvh = window.innerHeight (per JS gesetzt), vermeidet den
   100vh-Bug bei dem Safaris eigene Toolbar mitgezählt wird.    */
#app{
  position:fixed;top:0;left:0;right:0;
  height:var(--dvh,100vh);
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── NAVBAR ─────────────────────────────────────────────────── */
#navbar{
  flex-shrink:0;height:calc(var(--nb) + var(--st));
  padding-top:var(--st);padding-left:calc(12px + var(--sl));padding-right:calc(12px + var(--sr));
  background:rgba(28,28,30,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--sep);
  display:flex;align-items:flex-end;padding-bottom:8px;gap:8px;position:relative;z-index:100;
}
#nb-left{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:80px}
#nb-title{
  position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
  font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;
}
#nb-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;min-width:80px;justify-content:flex-end}
.nb-btn{
  background:var(--fill2);border:none;color:var(--blue);cursor:pointer;
  border-radius:var(--r8);padding:6px 12px;font-size:14px;font-weight:600;
  white-space:nowrap;min-height:34px;display:flex;align-items:center;gap:5px;
  transition:opacity .15s;
}
.nb-btn:active{opacity:.6}
.nb-btn.icon{padding:6px 10px;font-size:16px}
.nb-btn.destructive{color:var(--red)}
#nb-prog{font-size:13px;font-weight:600;color:var(--orange);letter-spacing:.02em;min-width:36px;text-align:right}
#gbar-track{width:52px;height:3px;background:var(--fill2);border-radius:2px;overflow:hidden}
#gfill{height:100%;background:var(--orange);transition:width .4s;width:0}

/* ── BODY ───────────────────────────────────────────────────── */
#body{display:flex;flex:1;overflow:hidden;position:relative}

/* ── SIDEBAR ────────────────────────────────────────────────── */
#sidebar{
  display:none; /* hidden on mobile by default */
  width:var(--sw);flex-shrink:0;
  background:var(--bg1);border-right:0.5px solid var(--sep);
  flex-direction:column;overflow:hidden;
}
/* Mobile sidebar as overlay */
#sidebar.mobile-open{
  display:flex;position:absolute;top:0;left:0;bottom:0;z-index:50;
  box-shadow:var(--shadow-lg);
}
#sidebar-backdrop{
  display:none;position:absolute;inset:0;z-index:49;background:rgba(0,0,0,.5);
}
#sidebar-backdrop.on{display:block}
@media(min-width:768px){
  #sidebar{display:flex}
  #sidebar-backdrop{display:none!important}
}
.sidebar-hd{
  padding:14px 16px 10px;font-size:11px;font-weight:600;letter-spacing:.07em;
  color:var(--label3);text-transform:uppercase;flex-shrink:0;
}
#ptree-wrap{flex:0 0 auto;max-height:46%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#ptree{padding:0 0 8px}
#snav-wrap{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#snav{padding:0 0 8px}

/* Project tree rows */
.prow{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;cursor:pointer;transition:background .12s;
}
.prow:active{background:var(--fill3)}
.prow.active{background:rgba(10,132,255,.12)}
.prow-icon{font-size:14px;flex-shrink:0}
.prow-name{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.active .prow-name{color:var(--blue)}
.prow-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.prow:hover .prow-acts{opacity:1}
.prow-acts button{background:none;border:none;color:var(--label3);font-size:13px;cursor:pointer;padding:2px 5px;border-radius:5px;transition:.12s}
.prow-acts button:hover{color:var(--label2)}
.prow-acts button.d:hover{color:var(--red)}

.srow{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px 8px 28px;cursor:pointer;transition:background .12s;
  border-left:2px solid transparent;
}
.srow:active{background:var(--fill3)}
.srow.on{background:rgba(10,132,255,.1);border-left-color:var(--blue)}
.srow .srow-icon{font-size:11px;flex-shrink:0;opacity:.5}
.srow-name{flex:1;font-size:13px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.on .srow-name{color:var(--blue)}
.nt-badge{
  background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:700;
  padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0;
}
.srow-del{color:var(--label4);font-size:12px;cursor:pointer;opacity:0;transition:.12s;padding:2px 4px}
.srow:hover .srow-del{opacity:1}
.srow-del:hover{color:var(--red)!important}
.add-sc-btn{
  display:flex;align-items:center;gap:6px;padding:8px 16px 8px 28px;
  font-size:13px;color:var(--blue);cursor:pointer;transition:.12s;
}
.add-sc-btn:active{opacity:.6}
.add-proj-btn{
  display:flex;align-items:center;gap:6px;padding:12px 16px;
  font-size:14px;font-weight:500;color:var(--blue);cursor:pointer;
  border-top:0.5px solid var(--sep);transition:.12s;margin-top:4px;
}
.add-proj-btn:active{opacity:.6}

/* Scene nav */
.scn{
  padding:8px 16px;cursor:pointer;border-left:3px solid transparent;transition:.12s;
}
.scn:active{background:var(--fill3)}
.scn.on{background:rgba(10,132,255,.1);border-left-color:var(--blue)}
.scn-lbl{font-size:12px;color:var(--label2);line-height:1.4;margin-bottom:4px;font-weight:500}
.scn.on .scn-lbl{color:var(--blue)}
.pt{height:2px;background:var(--fill2);border-radius:1px;overflow:hidden;margin-bottom:2px}
.pf{height:100%;border-radius:1px;transition:width .3s}
.pl{font-size:10px;color:var(--label3);font-weight:500}

/* ── MAIN ───────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Segmented control (iPad+) */
#seg-wrap{
  display:none;flex-shrink:0;padding:10px 16px;
  background:var(--bg1);border-bottom:0.5px solid var(--sep);
}
@media(min-width:768px){#seg-wrap{display:flex;align-items:center;gap:12px}}
#seg-ctrl{
  display:flex;background:var(--fill3);border-radius:var(--r10);padding:2px;flex:1;max-width:280px;
}
.seg-btn{
  flex:1;padding:6px;border:none;background:none;color:var(--label2);
  border-radius:var(--r8);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
}
.seg-btn.on{background:var(--bg3);color:var(--label);box-shadow:0 1px 4px rgba(0,0,0,.4)}
#seg-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{
  background:var(--fill2);border:none;color:var(--label2);cursor:pointer;
  border-radius:var(--r8);width:34px;height:34px;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{background:var(--fill1)}
.icon-btn:active{opacity:.6}

/* ── TAB CONTENT AREAS ──────────────────────────────────────── */
.tab-pane{flex:1;display:none;flex-direction:column;overflow:hidden}
.tab-pane.on{display:flex}

/* ── SCRIPT TAB ─────────────────────────────────────────────── */
#mode-toolbar{
  flex-shrink:0;background:rgba(28,28,30,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:0.5px solid var(--sep);
  padding:8px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
@media(max-width:520px){
  #mode-toolbar{padding:6px 10px;gap:5px}
  #mode-toolbar .mode-pill-row{display:contents}
}
.mode-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--fill3);border:none;color:var(--label2);
  padding:7px 12px;border-radius:var(--r20);font-size:13px;font-weight:600;
  cursor:pointer;transition:.15s;min-height:36px;flex-shrink:0;
}
/* Auf kleinen Bildschirmen: kürzere Pill-Beschriftung per data-short */
@media(max-width:520px){
  .mode-pill{padding:6px 10px;font-size:12px;min-height:32px;flex:1;justify-content:center}
  .mode-pill .pill-full{display:none}
  .mode-pill .pill-short{display:inline}
}
@media(min-width:521px){
  .mode-pill .pill-short{display:none}
  .mode-pill .pill-full{display:inline}
}
.mode-pill:active{opacity:.6}
.mode-pill.on.d{background:rgba(10,132,255,.2);color:var(--blue)}
.mode-pill.on.g{background:rgba(48,209,88,.18);color:var(--green)}
.mode-pill.on.w{background:rgba(255,159,10,.2);color:var(--orange)}
#srch-wrap{
  display:flex;align-items:center;gap:0;background:var(--fill3);
  border-radius:var(--r10);flex:1;min-width:100px;max-width:280px;margin-left:auto;
}
@media(max-width:520px){
  #srch-wrap{max-width:100%;margin-left:0;order:10;width:100%;flex-basis:100%}
}
#srch{
  background:none;border:none;color:var(--label);padding:8px 12px;
  font-size:15px;width:100%;outline:none;font-family:var(--font);
}
#srch::placeholder{color:var(--label3)}
#cwrap{display:flex;flex-wrap:wrap;gap:4px;padding:4px 14px 8px;flex-shrink:0;
  max-width:100%;overflow:hidden;-webkit-overflow-scrolling:touch;
  background:rgba(28,28,30,.92);border-bottom:0.5px solid var(--sep);
  max-height:200px;transition:max-height .22s ease, padding .22s ease, border .22s ease;
}
#cwrap.collapsed{max-height:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent}
#cwrap:empty{display:none}
/* Collapse-Leiste immer sichtbar wenn Chips vorhanden */
#chips-bar{
  display:none;flex-shrink:0;align-items:center;justify-content:center;
  background:rgba(28,28,30,.92);border-bottom:0.5px solid var(--sep);
  padding:0;
}
#chips-bar.visible{display:flex}
#chips-toggle{
  width:100%;padding:3px 14px;background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;font-family:var(--font);
  font-size:11px;font-weight:600;color:var(--label3);transition:color .15s;
  justify-content:center;
}
#chips-toggle:active{color:var(--label)}
#chips-toggle-icon{font-size:10px;transition:transform .22s ease;display:inline-block}
#chips-bar.collapsed #chips-toggle-icon{transform:rotate(-90deg)}
.cchip{
  padding:4px 12px;border-radius:var(--r20);font-size:12px;font-weight:600;
  cursor:pointer;opacity:.45;border:1.5px solid transparent;transition:.15s;white-space:nowrap;
  flex-shrink:0;
}
.cchip.on{opacity:1;border-color:currentColor}
.cchip:active{opacity:.7}

/* Chip Bearbeiten-Modus: × zum Ausblenden */
.cchip-wrap{position:relative;display:inline-flex;flex-shrink:0}
.cchip-x{
  position:absolute;top:-5px;right:-5px;
  width:17px;height:17px;background:var(--red);color:#fff;
  border-radius:50%;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;line-height:1;border:1.5px solid var(--bg0);
}

#mbar{
  flex-shrink:0;height:0;overflow:hidden;
  font-size:13px;font-weight:500;display:flex;align-items:center;padding:0 14px;transition:height .2s;
}
#mbar.d{height:34px;background:rgba(10,132,255,.15);border-bottom:0.5px solid rgba(10,132,255,.3);color:var(--blue)}
#mbar.g{height:34px;background:rgba(48,209,88,.12);border-bottom:0.5px solid rgba(48,209,88,.25);color:var(--green)}
#mbar.w{height:34px;background:rgba(255,159,10,.12);border-bottom:0.5px solid rgba(255,159,10,.3);color:var(--orange)}
/* ── Wort-Marker ─────────────────────────────────────────────── */
.wm{display:inline;border-radius:3px;transition:background .1s}
.wm.clk{cursor:pointer}
.wm.clk:hover,.wm.clk:active{background:rgba(255,159,10,.18)}
.wm.on{
  background:rgba(255,159,10,.28);color:var(--orange);
  border-radius:3px;padding:0 2px;margin:0 1px;
  outline:1.5px solid rgba(255,159,10,.45);outline-offset:0px;
}

#script-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 0 24px;
  background:#fff;touch-action:pan-y;}
#scontent{max-width:680px;width:100%;margin:0 auto;padding:0 16px}
@media(max-width:520px){
  #script-scroll{padding:16px 0}
  #scontent{padding:0 10px}
}

/* chips-bar touch target groß genug */
#chips-toggle{min-height:32px}

/* ── WELCOME ────────────────────────────────────────────────── */
#welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;min-height:50vh;text-align:center;padding:32px 24px;
}
.wico{font-size:56px;opacity:.15}
#welcome h2{font-size:20px;font-weight:700;color:var(--label2);letter-spacing:-.2px}
#welcome p{font-size:15px;color:var(--label3);max-width:280px;line-height:1.6}
.bigbtn{
  background:var(--blue);color:#fff;border:none;
  padding:14px 32px;border-radius:var(--r12);font-size:16px;font-weight:600;
  cursor:pointer;transition:.15s;letter-spacing:-.1px;min-height:50px;
}
.bigbtn:active{opacity:.8}
.hint{font-size:12px;color:var(--label4);letter-spacing:.04em}

/* ── SCREENPLAY ELEMENTS ────────────────────────────────────── */
.ssec{margin-bottom:44px}

/* Scene heading — sticky card auf weißem Hintergrund */
.shd{
  position:sticky;top:0;z-index:10;
  background:#e8f0ff;border:0.5px solid #c0d4f8;
  border-radius:var(--r10);padding:10px 14px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.08em;
  color:#0055cc;text-transform:uppercase;
}
.shd-stats{display:flex;align-items:center;gap:8px;font-size:10px;color:rgba(10,132,255,.7)}
.kd-btn{background:none;border:1.5px solid var(--sep);border-radius:var(--r8);color:var(--label3);font-size:10px;font-weight:700;padding:2px 8px;cursor:pointer;font-family:var(--font);transition:.15s;letter-spacing:.04em;flex-shrink:0;line-height:1.4}
.kd-btn.on{background:rgba(48,209,88,.15);color:var(--green);border-color:var(--green)}
.smbar{width:40px;height:2px;background:rgba(10,132,255,.2);border-radius:1px;overflow:hidden}
.smfill{height:100%;border-radius:1px;transition:width .3s;background:var(--blue)}

/* Notes — auf weißem Hintergrund */
.ntog{
  width:100%;text-align:left;background:none;border:1px dashed #ddd;
  color:#aaa;padding:8px 12px;font-size:13px;cursor:pointer;
  border-radius:var(--r8);transition:.15s;margin-bottom:10px;
  font-family:var(--font);display:flex;align-items:center;gap:6px;min-height:38px;
}
.ntog:active{background:#f5f5f5}
.nta{
  width:100%;background:#f7f7f7;border:0.5px solid #e0e0e0;color:#1c1c1e;
  padding:10px 14px;font-size:15px;font-family:var(--font);
  resize:vertical;min-height:60px;border-radius:var(--r10);
  outline:none;display:none;margin-bottom:12px;line-height:1.5;
}
.nta.open{display:block}
.nta:focus{border-color:var(--blue)}

/* Script lines — Helvetica auf weißem Hintergrund */
.ln{font-family:var(--mono);line-height:1.75;font-size:14px;color:#1c1c1e}
.ln-action{color:#555;margin:6px 0}
.ln-transition{color:#999;text-align:right;font-size:12px;padding:4px 0;letter-spacing:.08em}
.ln-character{
  text-align:center;padding-top:14px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.ln-parenthetical{text-align:center;color:#777;font-style:italic;font-size:13px}
.ln-dialogue{
  cursor:pointer;border-radius:var(--r8);position:relative;
  transition:background .1s;border-left:3px solid transparent;
  padding:2px 10px 2px 14px;margin:1px 0;
  font-weight:600;
}
@media(min-width:768px){
  .ln-character{text-align:left;padding-left:185px;justify-content:flex-start}
  .ln-parenthetical{text-align:left;padding-left:118px}
  .ln-dialogue{padding-left:76px;padding-right:76px}
}
.ln-dialogue:active,.ln-dialogue:hover{background:rgba(0,0,0,.05)}
.ln-dialogue.rec{text-decoration:line-through;opacity:.4}
.ln-dialogue.rec::after{
  content:'✓';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--green);font-size:13px;opacity:1;font-weight:700;
}
.ln-dialogue.isoff{font-style:italic}
.ln-dialogue.isnt{background:rgba(10,132,255,.1)}
.ln-dialogue.isnt::before{
  content:'🎙';position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:11px;
}
.ln-action.gclk,.ln-dialogue.gclk{cursor:crosshair}
.ln-action.gclk:hover,.ln-dialogue.gclk:hover{background:rgba(48,209,88,.1)}
.off-badge{
  background:rgba(10,132,255,.2);color:var(--blue);border:1px solid rgba(10,132,255,.3);
  border-radius:6px;font-size:10px;font-weight:700;padding:1px 6px;letter-spacing:.06em;
}
.ntlbl{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;cursor:pointer;opacity:.7}
.ntlbl:active{opacity:1}
.hl{background:rgba(255,159,10,.3);border-radius:3px}

/* ── NURTON TAB ─────────────────────────────────────────────── */
#nsubtabs{
  flex-shrink:0;display:flex;padding:0 14px;gap:0;
  background:var(--bg1);border-bottom:0.5px solid var(--sep);
}
.nstab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--label3);font-size:14px;font-weight:600;cursor:pointer;
  padding:12px 18px;transition:.15s;
}
.nstab.on{color:var(--blue);border-bottom-color:var(--blue)}
.nstab:active{opacity:.6}
#nscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}

/* Nurton stats bar */
.ntstats{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;border-bottom:0.5px solid var(--sep);
  flex-wrap:wrap;gap:6px;
}
.nts{padding:4px 12px;border-radius:var(--r20);font-size:13px;font-weight:600}
.nts.o{background:rgba(255,69,58,.15);color:var(--red)}
.nts.d{background:rgba(48,209,88,.15);color:var(--green)}
.nts.t{background:var(--fill3);color:var(--label3)}
.ntempty{
  text-align:center;padding:48px 24px;color:var(--label3);
  font-size:15px;line-height:2.2;
}
.ntempty small{font-size:13px;display:block;line-height:1.8}

/* Nurton cards (mobile) */
.nt-cards{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.nt-card{
  background:var(--bg2);border-radius:var(--r12);overflow:hidden;
  box-shadow:var(--shadow);
}
.nt-card.done{opacity:.5}
.nt-card-top{
  display:flex;align-items:center;gap:8px;padding:12px 14px 0;
}
.nt-card-char{font-size:12px;font-weight:700;letter-spacing:.06em}
.nt-card-scene{flex:1;font-size:11px;color:var(--label3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-badges{display:flex;gap:4px}
.badge{border-radius:5px;font-size:10px;font-weight:700;padding:2px 6px}
.badge.auto{background:rgba(10,132,255,.2);color:var(--blue)}
.badge.man{background:rgba(255,159,10,.2);color:var(--orange)}
.badge.off{background:rgba(48,209,88,.15);color:var(--green)}
.nt-card-text{padding:8px 14px;font-size:14px;color:var(--label);line-height:1.5;font-family:var(--mono)}
.nt-card-bottom{
  display:flex;align-items:center;gap:8px;padding:8px 14px 12px;
  border-top:0.5px solid var(--sep);
}
.stbtn{
  background:none;border:1.5px solid var(--sep);border-radius:var(--r20);
  font-size:13px;font-weight:600;padding:5px 14px;cursor:pointer;transition:.15s;
  min-height:32px;font-family:var(--font);
}
.stbtn.offen{color:var(--label3)}
.stbtn.offen:active{border-color:var(--red);color:var(--red)}
.stbtn.erledigt{color:var(--green);border-color:var(--green);background:rgba(48,209,88,.1)}
.nt-note{
  flex:1;background:var(--fill3);border:none;border-radius:var(--r8);
  color:var(--label);padding:6px 10px;font-size:14px;font-family:var(--font);outline:none;
}
.nt-del-btn{
  background:none;border:none;color:var(--label4);font-size:18px;cursor:pointer;
  padding:4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r8);transition:.15s;
}
.nt-del-btn:active{color:var(--red)}

/* Desktop table for Nurtons (iPad/desktop) */
.nttbl{display:none;width:100%;border-collapse:collapse;font-size:13px}
@media(min-width:768px){
  .nttbl{display:table}
  .nt-cards{display:none}
}
.nttbl thead tr{border-bottom:1.5px solid var(--sep-o)}
.nttbl th{text-align:left;padding:10px 14px;font-size:10px;font-weight:600;
  letter-spacing:.1em;color:var(--label3);text-transform:uppercase}
.nttbl tbody tr{border-bottom:0.5px solid var(--sep);transition:.1s}
.nttbl tbody tr:hover{background:var(--fill3)}
.nttbl tbody tr.done{opacity:.45}
.nttbl td{padding:8px 14px;vertical-align:middle}
.td-num{color:var(--label3);width:32px;text-align:center;font-size:12px}
.td-scene{color:var(--label3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.td-char{font-weight:700;white-space:nowrap;max-width:100px}
.td-text{max-width:260px;font-family:var(--mono);font-size:12px}
.td-ref{color:var(--label3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;font-size:12px}
.td-note{background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label);
  padding:4px 8px;font-size:12px;font-family:var(--font);outline:none;width:110px}
.td-del{background:none;border:none;color:var(--label4);cursor:pointer;font-size:15px;padding:4px 6px}
.td-del:hover{color:var(--red)}

/* Nurton table pagination wrapper */
#ntbl-wrap{padding:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── NURTON SZENENGRUPPEN ────────────────────────────────────── */
.nt-grp-hd{
  padding:10px 16px 8px;margin-top:14px;
  font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--blue);
  text-transform:uppercase;
  background:rgba(10,132,255,.09);
  border-top:0.5px solid rgba(10,132,255,.25);
  border-bottom:0.5px solid rgba(10,132,255,.18);
  display:flex;align-items:center;gap:8px;
}
.nt-grp-hd:first-child{margin-top:0;border-top:none}
.nt-grp-prog{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px}
.nt-grp-prog-open{color:var(--red);font-weight:600}
.nt-grp-prog-done{color:var(--green);font-weight:600}
.nt-grp-bar{width:44px;height:3px;background:rgba(10,132,255,.2);border-radius:2px;overflow:hidden}
.nt-grp-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

/* Szenen-Trennzeile in Desktop-Tabelle */
.nt-sep-row>td{
  background:rgba(10,132,255,.09);color:var(--blue);
  font-size:10px;font-weight:700;letter-spacing:.1em;
  padding:9px 14px;text-transform:uppercase;
  border-top:1px solid rgba(10,132,255,.25);
}
.nt-sep-stats{float:right;font-weight:400;color:rgba(10,132,255,.65);letter-spacing:.04em}

/* ── BOTTOM TAB BAR (mobile) ────────────────────────────────── */
#tabbar{
  display:flex;flex-shrink:0;
  height:var(--tb);padding-bottom:var(--sb);padding-left:var(--sl);padding-right:var(--sr);
  background:rgba(28,28,30,.92);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:0.5px solid var(--sep);
}
@media(min-width:768px){#tabbar{display:none}}
.tabitem{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;
  padding:6px 4px 0;color:var(--label3);font-size:10px;font-weight:500;
  transition:color .15s;position:relative;
  min-height:44px; /* Apple HIG minimum */
  -webkit-appearance:none;touch-action:manipulation;
}
.tabitem.on{color:var(--blue)}
.tabitem-icon{font-size:22px;line-height:1}
.tabitem-badge{
  position:absolute;top:2px;right:calc(50% - 20px);
  background:var(--red);color:#fff;border-radius:8px;font-size:10px;font-weight:700;
  padding:0 5px;min-width:16px;text-align:center;
  display:none;border:2px solid var(--bg1);
}
.tabitem-badge.on{display:block}

/* ── MOBILE PROJECTS VIEW ────────────────────────────────────── */
#proj-view{display:none;flex:1;flex-direction:column;overflow:hidden}
#proj-view.on{display:flex}
#proj-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.proj-card{
  background:var(--bg2);border-radius:var(--r16);overflow:hidden;
  margin-bottom:16px;box-shadow:var(--shadow);
}
.proj-card-hd{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:0.5px solid var(--sep);
}
.proj-card-hd h3{font-size:16px;font-weight:700;flex:1}
.proj-hd-btns{display:flex;gap:4px}
.proj-hd-btn{
  background:var(--fill3);border:none;color:var(--label2);border-radius:var(--r8);
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;
}
.proj-hd-btn:active{opacity:.6}
.proj-hd-btn.del{color:var(--red)}
.script-row{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  cursor:pointer;border-bottom:0.5px solid var(--sep);transition:.12s;
}
.script-row:last-child{border-bottom:none}
.script-row:active{background:var(--fill3)}
.script-row.on{background:rgba(10,132,255,.1)}
.script-row-info{flex:1;min-width:0}
.script-row-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.script-row.on .script-row-name{color:var(--blue)}
.script-row-meta{font-size:12px;color:var(--label3);margin-top:1px}
.script-row-chevron{color:var(--label4);font-size:14px;flex-shrink:0}
.add-script-row{
  display:flex;align-items:center;gap:8px;padding:13px 16px;
  color:var(--blue);font-size:15px;font-weight:600;cursor:pointer;
}
.add-script-row:active{opacity:.6}
.add-proj-card{
  background:var(--fill3);border-radius:var(--r16);padding:14px 16px;
  display:flex;align-items:center;gap:10px;cursor:pointer;
  color:var(--blue);font-size:15px;font-weight:600;
}
.add-proj-card:active{opacity:.6}

/* ── FAB — Floating Action Button (mobil, Modus-Umschalter) ── */
#fab{
  position:fixed;right:18px;
  bottom:calc(var(--tb) + 20px + var(--sb));
  z-index:200;display:flex;flex-direction:column-reverse;align-items:center;gap:10px;
  /* pointer-events:none entfernt — blockierte Taps auf iOS */
}
@media(min-width:768px){#fab{display:none}}
#fab-btn{
  width:58px;height:58px;border-radius:50%;border:none;
  background:rgba(60,60,67,.8);color:var(--label);font-size:26px;
  box-shadow:0 4px 24px rgba(0,0,0,.55);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .15s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-appearance:none;
}
#fab-btn:active{transform:scale(.9);opacity:.8}
#fab-btn.d{background:var(--blue)}
#fab-btn.g{background:var(--green)}
#fab-btn.w{background:var(--orange)}
#fab-label{
  background:rgba(28,28,30,.95);color:var(--label);
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--r20);
  white-space:nowrap;opacity:0;transition:opacity .25s;
  box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;
}
#fab-label.on{opacity:1}

/* ── ACTION SHEET (Long Press) ───────────────────────────────── */
#as-overlay{
  display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  align-items:flex-end;justify-content:center;
}
#as-overlay.on{display:flex}
#as-sheet{
  width:100%;max-width:500px;
  padding:0 10px calc(10px + var(--sb));
  transform:translateY(120%);transition:transform .32s cubic-bezier(.32,0,.22,1);
}
#as-sheet.open{transform:translateY(0)}
#as-card{
  background:var(--bg2);border-radius:var(--r16);overflow:hidden;
  margin-bottom:10px;box-shadow:var(--shadow-lg);
}
#as-title{
  padding:13px 16px;font-size:13px;color:var(--label3);
  border-bottom:0.5px solid var(--sep);
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.as-item{
  width:100%;background:none;border:none;border-bottom:0.5px solid var(--sep);
  font-size:17px;font-weight:500;font-family:var(--font);
  padding:17px 16px;text-align:center;cursor:pointer;display:block;
  transition:background .1s;
}
.as-item:last-child{border-bottom:none}
.as-item:active{background:var(--fill3)}
#as-cancel{
  width:100%;background:var(--bg2);border:none;border-radius:var(--r16);
  color:var(--blue);font-size:17px;font-weight:700;font-family:var(--font);
  padding:17px 16px;cursor:pointer;display:block;box-shadow:var(--shadow);
}
#as-cancel:active{background:var(--bg3)}

/* ── BACKUP ──────────────────────────────────────────────────── */
#backup-bar{
  flex-shrink:0;display:flex;gap:8px;
  padding:10px 10px calc(10px + var(--sb));
  border-top:0.5px solid var(--sep);background:var(--bg2);
}
@media(min-width:768px){#backup-bar{padding-bottom:10px}}
.bk-btn{
  flex:1;background:var(--fill3);border:none;color:var(--label2);
  border-radius:var(--r10);font-size:12px;font-weight:600;
  padding:9px 8px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:5px;transition:opacity .15s;font-family:var(--font);
}
.bk-btn:active{opacity:.6}
.bk-btn.imp{color:var(--blue)}
.proj-bk-card{
  background:var(--bg2);border-radius:var(--r16);overflow:hidden;
  margin-bottom:16px;box-shadow:var(--shadow);
}
.proj-bk-hd{
  padding:12px 16px;font-size:14px;font-weight:700;
  border-bottom:0.5px solid var(--sep);display:flex;align-items:center;gap:8px;
}
.proj-bk-info{padding:10px 16px;font-size:13px;color:var(--label3);line-height:1.7}
.proj-bk-btns{display:flex;gap:10px;padding:0 16px 14px}

/* ═══════════════════════════════════════════════════════════════
   TONBERICHT — Visuelle Hierarchie
   bg0(#000) base → bg1 Scene → bg0 Ei-Body → bg1 Ei-Card → bg2 Take
═══════════════════════════════════════════════════════════════ */
#tb-toolbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg1);border-bottom:0.5px solid var(--sep)}
#tb-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;touch-action:pan-y;background:var(--bg0)}
.tb-section{margin-bottom:16px}
.tb-sec-hd{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--label3);text-transform:uppercase;padding:5px 0 7px;border-bottom:0.5px solid var(--sep);margin-bottom:9px}
.tb-empty{font-size:13px;color:var(--label4);padding:8px 0;font-style:italic}

/* ── Drehtag-Karte ───────────────────────────────────────────── */
.tb-dt-card{background:var(--bg2);border-radius:var(--r12);padding:12px;margin-bottom:8px;border:0.5px solid var(--sep)}
.tb-dt-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:0.5px solid var(--sep)}
.tb-dt-num{font-size:13px;font-weight:700;flex:1;color:var(--label)}
.tb-dt-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.tb-dt-row{display:flex;flex-direction:column;gap:3px}
.tb-dt-row label{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--label3);text-transform:uppercase}

/* ── Szene — Ebene 1 (bg1 auf bg0-Base) ─────────────────────── */
.tb-scene{background:var(--bg1);border-radius:var(--r12);margin-bottom:8px;overflow:hidden;border:0.5px solid rgba(255,255,255,.06)}
.tb-scene-hd{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--bg2);border-bottom:0.5px solid var(--sep)}
.tb-scene-title{flex:1;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-progress>.tb-scene-hd{border-left:3px solid var(--orange)}
.sc-done>.tb-scene-hd{border-left:3px solid var(--green)}
.tb-scene-progress-badge{flex-shrink:0;font-size:10px;font-weight:700;border-radius:var(--r20);padding:2px 8px;letter-spacing:.04em;white-space:nowrap}
.sc-progress .tb-scene-progress-badge{background:rgba(255,159,10,.2);color:var(--orange)}
.sc-done .tb-scene-progress-badge{background:rgba(48,209,88,.2);color:var(--green)}
.tb-scene-body{overflow:hidden;transition:max-height .25s ease;max-height:9999px}
.tb-scene-body.collapsed{max-height:0}

/* ── Rollen-Panel ────────────────────────────────────────────── */
.tb-scene-chars-panel{padding:7px 10px 9px;border-bottom:0.5px solid var(--sep);background:rgba(0,0,0,.25)}
.tb-scene-chars-hd{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--label3);margin-bottom:6px}
.tb-scene-chars-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tb-scene-char-badge{display:flex;align-items:center;gap:4px;border-radius:var(--r20);padding:3px 5px 3px 10px;font-size:11px;font-weight:600;border:1.5px solid;background:transparent}
.tb-scene-char-remove{background:none;border:none;cursor:pointer;padding:0;font-size:12px;color:inherit;opacity:.55;transition:.12s;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.tb-scene-char-remove:hover{opacity:1;background:rgba(255,69,58,.2)}
.tb-scene-char-add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb-scene-char-sel{flex:1;background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label);padding:6px 10px;font-size:13px;font-family:var(--font);outline:none;cursor:pointer;min-width:0}
.tb-scene-char-add-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r8);font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;font-family:var(--font);min-height:30px;white-space:nowrap;flex-shrink:0}
.tb-scene-char-add-btn:active{opacity:.8}
.tb-scene-char-reset{background:none;border:none;font-size:11px;color:var(--label4);cursor:pointer;font-family:var(--font);padding:0;text-decoration:underline}

/* ── Einstellung — Ebene 2 (bg0-Body, bg1-Card) ─────────────── */
.tb-ei-list{padding:5px 7px 2px;background:var(--bg0)}
.tb-ei-card{background:var(--bg1);border-radius:var(--r10);margin-bottom:5px;overflow:hidden;border:0.5px solid rgba(10,132,255,.2)}
.tb-ei-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:0.5px solid rgba(10,132,255,.15);background:rgba(10,132,255,.09);cursor:pointer}
.tb-ei-letter{background:var(--blue);color:#fff;border-radius:5px;width:25px;height:25px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.tb-ei-codename{font-size:10px;font-weight:600;letter-spacing:.06em;color:rgba(10,132,255,.7);margin-top:1px;font-family:'Helvetica Neue',monospace}
.tb-char-chips{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.tb-char-chip{border:1.5px solid currentColor;background:none;border-radius:var(--r20);font-size:11px;font-weight:600;padding:2px 8px;cursor:pointer;transition:.15s;font-family:var(--font);min-height:24px}
.tb-char-chip.off{color:var(--label4)!important;background:none!important;border-color:var(--sep)!important;text-decoration:line-through}
.tb-ei-body{overflow:hidden;transition:max-height .2s ease;max-height:2000px;background:var(--bg1)}
.tb-ei-body.collapsed{max-height:0}
.tb-ei-ctrl{display:flex;gap:7px;padding:4px 7px 6px;background:var(--bg0)}

/* ── Kanal + Flags ───────────────────────────────────────────── */
.tb-kanal-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:5px 10px 6px;border-top:0.5px solid var(--sep);background:rgba(0,0,0,.28)}
.tb-kanal-row-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--label3);text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.tb-kanal-chip{border:1.5px solid var(--sep);background:var(--fill3);border-radius:var(--r20);font-size:11px;font-weight:600;padding:2px 9px;cursor:pointer;color:var(--label3);transition:.15s;font-family:var(--font);min-height:24px}
.tb-kanal-chip.on{background:rgba(64,203,224,.15);color:var(--teal);border-color:var(--teal)}
.tb-kanal-chip.char-on{border-color:currentColor}
.tb-flag-row{display:flex;align-items:center;gap:5px;padding:4px 10px 5px;border-top:0.5px solid var(--sep);flex-wrap:wrap;background:rgba(0,0,0,.18)}
.tb-flag-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--label3);text-transform:uppercase;flex-shrink:0}
.tb-flag-btn{border:1.5px solid var(--sep);background:var(--fill3);border-radius:var(--r8);font-size:11px;font-weight:600;padding:3px 8px;cursor:pointer;color:var(--label3);transition:.15s;font-family:var(--font);min-height:24px;letter-spacing:.04em}
.tb-flag-btn.on-pu{background:rgba(255,159,10,.15);color:var(--orange);border-color:var(--orange)}
.tb-flag-btn.on-v{background:rgba(48,209,88,.15);color:var(--green);border-color:var(--green)}
.tb-flag-btn.on-mos{background:rgba(255,69,58,.15);color:var(--red);border-color:var(--red)}
.tb-flag-btn.on-slomo{background:rgba(100,100,255,.15);color:#8080ff;border-color:#8080ff}
.tb-ts-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:auto}
.tb-ts-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--label3);text-transform:uppercase}
.tb-ts-inp{width:40px!important;font-family:monospace!important;font-size:12px!important;padding:2px 4px!important;text-align:center}

/* ── Take — Ebene 3 (bg2, klar über bg1 Ei-Card) ───────────── */
.tb-take-card{background:var(--bg2);margin:4px 7px;border-radius:var(--r10);overflow:hidden;border:0.5px solid var(--sep)}
.tb-take-card.best{background:rgba(255,159,10,.07);border-color:rgba(255,159,10,.22)}
.tb-take-hd{display:flex;align-items:center;gap:6px;padding:7px 9px;flex-wrap:wrap;background:var(--bg3);cursor:pointer;border-bottom:0.5px solid var(--sep)}
.tb-take-card.is-collapsed .tb-take-hd{border-bottom:none}
.tb-take-num{font-size:12px;font-weight:700;min-width:48px;color:var(--label)}
/* Summary-Zeile (wenn Take zugeklappt) */
.tb-take-summary{display:none;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 9px 7px;font-size:11px}
.tb-take-card.is-collapsed .tb-take-summary{display:flex}
.tb-take-card.is-collapsed .tb-take-body{max-height:0;padding:0;overflow:hidden}
.tb-sum-chip{background:var(--fill2);border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600;color:var(--label2)}
.tb-sum-chip.ok{background:rgba(48,209,88,.15);color:var(--green)}
.tb-sum-chip.issue{background:rgba(255,69,58,.15);color:var(--red)}
.tb-sum-chip.noise{background:rgba(255,159,10,.15);color:var(--orange)}
.tb-sum-comment{color:var(--label3);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;font-size:10px}
.tb-take-body{padding:8px 9px 5px;overflow:hidden;transition:max-height .2s ease;max-height:2000px}
.tb-stars{display:flex;gap:1px}
.tb-star{background:none;border:none;font-size:16px;cursor:pointer;color:var(--fill1);transition:color .1s;padding:0 1px;line-height:1}
.tb-star.on{color:var(--orange)}
.tb-star:hover{color:var(--orange);opacity:.7}
.tb-best-btn{background:none;border:1.5px solid var(--sep);border-radius:var(--r8);font-size:11px;font-weight:600;padding:3px 8px;cursor:pointer;color:var(--label3);transition:.15s;min-height:25px;font-family:var(--font)}
.tb-best-btn.on{border-color:var(--orange);color:var(--orange);background:rgba(255,159,10,.1)}
.tb-del-btn{background:none;border:none;color:var(--label4);font-size:14px;cursor:pointer;padding:3px 5px;min-width:25px;min-height:25px;margin-left:auto;border-radius:var(--r8);transition:.15s;display:flex;align-items:center;justify-content:center}
.tb-del-btn:active{color:var(--red)}
.tb-add-take-row{padding:3px 7px 6px;background:var(--bg0);display:flex;align-items:center}
.tb-add-take-btn{flex:1;background:rgba(10,132,255,.1);border:none;color:var(--blue);border-radius:var(--r8);padding:7px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--font)}
.tb-add-take-btn:active{background:rgba(10,132,255,.2)}
.tb-take-count{font-size:10px;color:var(--label4);font-weight:500;padding:0 7px;white-space:nowrap}

/* ── Take Controls ───────────────────────────────────────────── */
.tb-take-name-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:4px 7px;background:rgba(10,132,255,.1);border-radius:var(--r8)}
.tb-take-name-badge{font-family:'Helvetica Neue',monospace;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.05em;flex:1}
.tb-copy-btn{background:none;border:none;color:var(--label3);font-size:12px;cursor:pointer;padding:2px 4px;border-radius:var(--r8);transition:.12s;min-height:22px}
.tb-copy-btn:active{color:var(--blue);background:rgba(10,132,255,.15)}
.tb-take-ctrl-row{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.tb-take-label-inp{flex:1;min-width:70px;max-width:190px!important;font-size:12px!important;padding:3px 6px!important;font-style:italic}
.tb-sort-btn{background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label3);font-size:12px;cursor:pointer;width:25px;height:25px;display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0}
.tb-sort-btn:active{background:var(--fill1);color:var(--label)}
.tb-sort-btn:disabled{opacity:.25;cursor:default}
.tb-move-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--label3);text-transform:uppercase;white-space:nowrap}
.tb-move-sel{font-size:12px;padding:4px 8px;max-width:160px}

/* ── Dialog + Noise Criteria ─────────────────────────────────── */
.tb-criteria-section{margin-bottom:7px}
.tb-criteria-hd{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--label3);text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.tb-verst-row{display:flex;align-items:center;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.tb-crit-label{font-size:11px;color:var(--label2);min-width:90px;flex-shrink:0}
.tb-verst-btn{background:var(--fill3);border:1.5px solid transparent;border-radius:var(--r20);font-size:11px;font-weight:600;padding:3px 10px;cursor:pointer;color:var(--label3);transition:.15s;min-height:26px;font-family:var(--font)}
.tb-verst-btn.on-gut{background:rgba(48,209,88,.15);color:var(--green);border-color:var(--green)}
.tb-verst-btn.on-mittel{background:rgba(255,159,10,.15);color:var(--orange);border-color:var(--orange)}
.tb-verst-btn.on-schlecht{background:rgba(255,69,58,.15);color:var(--red);border-color:var(--red)}
.tb-bool-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tb-crit-chip{background:var(--fill3);border:1.5px solid transparent;border-radius:var(--r20);font-size:11px;font-weight:600;padding:3px 10px;cursor:pointer;color:var(--label3);transition:.15s;min-height:26px;font-family:var(--font)}
.tb-crit-chip.on{background:rgba(255,69,58,.15);color:var(--red);border-color:var(--red)}
.tb-crit-chip.on.noise{background:rgba(255,159,10,.15);color:var(--orange);border-color:var(--orange)}
.tb-custom-noise-row{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.tb-kom-row{padding-bottom:3px}
.tb-kom{width:100%;min-height:40px;resize:vertical}

/* ── Teilstück-Gruppen ───────────────────────────────────────── */
.tb-ts-group{margin:0 7px 6px;border:1px dashed rgba(10,132,255,.22);border-radius:var(--r10);overflow:hidden}
.tb-ts-group-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(10,132,255,.07);border-bottom:0.5px solid rgba(10,132,255,.15)}
.tb-ts-group-lbl{font-size:12px;font-weight:700;font-family:monospace;letter-spacing:.06em;color:var(--blue)}

/* ── Nurtöne ─────────────────────────────────────────────────── */
.tb-nurton-section{background:rgba(48,209,88,.04);border-top:1px solid rgba(48,209,88,.14);padding:7px 9px}
.tb-nurton-hd{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.tb-nurton-item{background:rgba(48,209,88,.06);border:0.5px solid rgba(48,209,88,.16);border-radius:var(--r10);margin-bottom:6px;overflow:hidden}
.tb-nurton-item-hd{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:0.5px solid rgba(48,209,88,.12)}
.tb-nurton-name-inp{flex:1;background:transparent!important;font-size:13px!important;font-weight:600!important;color:var(--green)!important;padding:2px 3px!important}
.tb-nurton-name-inp::placeholder{color:rgba(48,209,88,.4)!important}
.tb-nurton-add-btn{background:rgba(48,209,88,.14);color:var(--green);border:1px solid rgba(48,209,88,.28);border-radius:var(--r8);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:var(--font);transition:.15s}
.tb-nurton-add-btn:active{background:rgba(48,209,88,.28)}

/* ── Collapse ────────────────────────────────────────────────── */
.tb-collapse-btn{background:none;border:none;cursor:pointer;color:var(--label2);font-size:18px;padding:4px 8px;border-radius:var(--r8);transition:.15s;flex-shrink:0;line-height:1;min-height:32px;min-width:32px;display:flex;align-items:center;justify-content:center}
.tb-collapse-btn:active{color:var(--label)}
.tb-collapse-icon{display:inline-block;transition:transform .2s ease;font-size:18px}
.tb-collapse-icon.collapsed{transform:rotate(-90deg)}

/* ── Inputs ──────────────────────────────────────────────────── */
.tb-input{background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label);padding:6px 9px;font-size:13px;font-family:var(--font);outline:none;width:100%;transition:background .15s}
.tb-input:focus{background:var(--fill1)}
.tb-input-sm{font-size:12px!important;padding:4px 7px!important}
.tb-select{background:var(--fill3);border:none;border-radius:var(--r8);color:var(--label);padding:5px 9px;font-size:13px;font-family:var(--font);outline:none;cursor:pointer}
.tb-select-sm{font-size:12px;padding:3px 7px}
.tb-add-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r8);font-size:12px;font-weight:600;padding:5px 13px;cursor:pointer;transition:opacity .15s;font-family:var(--font);min-height:30px}
.tb-add-btn:active{opacity:.8}
.tb-pill-btn{background:var(--fill3);border:none;color:var(--blue);border-radius:var(--r20);font-size:12px;font-weight:600;padding:5px 13px;cursor:pointer;transition:.15s;font-family:var(--font);min-height:30px;white-space:nowrap}
.tb-pill-btn:active{opacity:.7}
.tb-pill-btn.destr{color:var(--red)}

/* ── Projekt-Karte ───────────────────────────────────────────── */
.tb-projekt-card{background:var(--bg2);border-radius:var(--r12);padding:12px;margin-bottom:12px;box-shadow:var(--shadow);border:0.5px solid rgba(10,132,255,.18)}
.tb-projekt-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:7px;border-bottom:0.5px solid var(--sep)}
.tb-projekt-hd-title{font-size:14px;font-weight:700;color:var(--label);flex:1}
.tb-projekt-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;align-items:end}
.tb-projekt-row{display:flex;flex-direction:column;gap:3px}
.tb-projekt-row label{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--label3);text-transform:uppercase}
.tb-seg-row{display:flex;gap:4px}
.tb-seg-btn{flex:1;background:var(--fill3);border:1.5px solid transparent;border-radius:var(--r8);color:var(--label3);font-size:12px;font-weight:600;padding:6px 4px;cursor:pointer;transition:.15s;font-family:var(--font);text-align:center}
.tb-seg-btn.on{background:rgba(10,132,255,.15);color:var(--blue);border-color:var(--blue)}

/* ── Szenennummer-Editor ─────────────────────────────────────── */
.tb-scene-num-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tb-scene-num-inp{width:50px!important;font-family:'Helvetica Neue',monospace!important;font-size:12px!important;font-weight:700!important;padding:3px 4px!important;text-align:center;letter-spacing:.04em}
.tb-scene-num-adj{background:none;border:1px solid var(--sep);border-radius:var(--r8);color:var(--label3);font-size:10px;font-weight:600;padding:3px 7px;cursor:pointer;transition:.15s;font-family:var(--font);white-space:nowrap;flex-shrink:0}
.tb-scene-num-adj:active{background:var(--fill1);color:var(--blue)}

/* ── Passage-Abhaken ─────────────────────────────────────────── */
.passage-all-btn{display:block;font-size:10px;font-weight:600;color:var(--blue);background:rgba(10,132,255,.08);border:none;border-radius:var(--r8);padding:2px 10px;cursor:pointer;margin:2px 0 4px 14px;font-family:var(--font);transition:.15s;text-align:left}
.passage-all-btn:active{background:rgba(10,132,255,.18)}
.passage-all-btn.all-done{color:var(--green);background:rgba(48,209,88,.1)}
.wm{display:inline;border-radius:3px;transition:background .1s}
.wm.clk{cursor:pointer}
.wm.clk:hover,.wm.clk:active{background:rgba(255,159,10,.18)}
.wm.on{background:rgba(255,159,10,.28);color:var(--orange);border-radius:3px;padding:0 2px;margin:0 1px;outline:1.5px solid rgba(255,159,10,.45);outline-offset:0px}

/* ── Mobile ──────────────────────────────────────────────────── */
@media(max-width:520px){
  #tb-content{padding:8px 9px}
  #tb-toolbar{padding:6px 10px;flex-wrap:wrap;gap:6px}
  #tb-toolbar>span{display:none}
  .tb-projekt-body,.tb-dt-body{grid-template-columns:1fr 1fr}
  .tb-scene-hd{flex-wrap:wrap;gap:5px}
  .tb-scene-title{font-size:10px}
  .tb-ei-hd{flex-wrap:wrap;gap:6px}
  .tb-take-hd{flex-wrap:wrap;row-gap:4px}
  .tb-take-label-inp{max-width:100%!important;flex-basis:100%;order:5}
  .tb-kanal-row{padding:5px 9px 6px}
  .tb-dt-card,.tb-scene,.tb-ei-card,.tb-take-card{border-radius:var(--r10)}
  .tb-verst-row{flex-wrap:wrap}
  .tb-crit-label{min-width:unset;width:100%}
}
@media(max-width:380px){
  .tb-take-num{font-size:11px;min-width:42px}
  .tb-star{font-size:15px}
  .tb-bool-wrap,.tb-ei-roles{gap:3px}
}

</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spin"></div>
  <p id="load-msg">Lade Drehbuch …</p>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL: COLOR PICKER -->
<div id="movl" onclick="if(event.target===this)closeMod()">
  <div id="modal">
    <h3>🎨 Rollen verwalten</h3>
    <div id="mchars" style="overflow-y:auto;max-height:calc(70vh - 120px)"></div>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="bigbtn" style="flex:1;padding:12px" onclick="closeMod()">Fertig</button>
    </div>
  </div>
</div>

<!-- SIDEBAR BACKDROP (mobile) -->
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- APP -->
<div id="app">

  <!-- NAVBAR -->
  <div id="navbar">
    <div id="nb-left">
      <button class="nb-btn icon" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <div id="nb-title">CineScript</div>
    <div id="nb-right">
      <span id="nb-prog">–</span>
      <div id="gbar-track"><div id="gfill"></div></div>
      <button class="nb-btn icon" onclick="openMod()" title="Farben">🎨</button>
      <button class="nb-btn icon destructive" onclick="doReset()" title="Reset">↺</button>
    </div>
  </div>

  <!-- BODY -->
  <div id="body">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-hd">Projekte</div>
      <div id="ptree-wrap"><div id="ptree"></div></div>
      <div class="sidebar-hd" style="border-top:0.5px solid var(--sep);padding-top:12px">Szenen</div>
      <div id="snav-wrap"><div id="snav"></div></div>
      <!-- Backup-Leiste am Fuß der Sidebar -->
      <div id="backup-bar">
        <button class="bk-btn" onclick="exportBackup()">💾 Sichern</button>
        <button class="bk-btn imp" onclick="g('bk-in').click()">📂 Laden</button>
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">

      <!-- Segmented control + actions (iPad/desktop) -->
      <div id="seg-wrap">
      <div id="seg-ctrl" style="max-width:380px">
          <button class="seg-btn on" onclick="setTab('s')">Drehbuch</button>
          <button class="seg-btn" onclick="setTab('n')">Nurtöne <span id="seg-nt-cnt"></span></button>
          <button class="seg-btn" onclick="setTab('t')">🎚 Tonbericht</button>
        </div>
        <div id="seg-right">
          <button class="icon-btn" onclick="expStatus()" title="Status exportieren">⬇</button>
        </div>
      </div>

      <!-- MOBILE PROJECTS VIEW -->
      <div id="proj-view">
        <div id="proj-scroll"></div>
      </div>

      <!-- SCRIPT TAB -->
      <div id="tab-s" class="tab-pane on">
        <div id="mode-toolbar">
          <button id="mbd" class="mode-pill" onclick="setMode('d')" title="[1]"><span class="pill-full">🎙 Dialog</span><span class="pill-short">🎙</span></button>
          <button id="mbg" class="mode-pill" onclick="setMode('g')" title="[2]"><span class="pill-full">🔊 Geräusch</span><span class="pill-short">🔊</span></button>
          <button id="mbw" class="mode-pill" onclick="setMode('w')" title="[3]"><span class="pill-full">✏ Wort-Marker</span><span class="pill-short">✏</span></button>
          <div id="srch-wrap">
            <input id="srch" type="search" placeholder="Suchen …" autocomplete="off" oninput="doSearch(this.value)">
          </div>
        </div>
        <div id="chips-bar">
          <button id="chips-toggle" onclick="toggleChips()">
            <span id="chips-toggle-icon">▾</span>

<script>
/* ═══════════════════════════════════════════════════════════════
   iOS VIEWPORT FIX — läuft als erstes, vor allem anderen
   ---------------------------------------------------------------
   Problem: Safari auf iPhone zieht die Höhe seines eigenen
   Toolbars (URL-Bar + Bottom-Bar) NICHT von 100vh ab. Dadurch
   verschwindet der Tab-Bar unter dem Safari-Toolbar und die App
   ist nicht bedienbar.
   Fix: --dvh wird auf window.innerHeight gesetzt = tatsächlich
   sichtbare Höhe. #app nutzt var(--dvh) statt 100vh.
═══════════════════════════════════════════════════════════════ */
(function iosViewportFix(){
  function set(){
    document.documentElement.style.setProperty('--dvh', window.innerHeight + 'px');
  }
  set();
  window.addEventListener('resize', set, {passive:true});
  /* Nach Orientierungswechsel kurz warten bis Safari fertig ist */
  window.addEventListener('orientationchange', function(){setTimeout(set, 300);}, {passive:true});
})();

/* ═══════════════════════════════════════════════════════════════
   PDF.js — LAZY LOADING
   ---------------------------------------------------------------
   PDF.js wird nicht mehr beim App-Start geladen (das blockierte
   Safari bei fehlendem Internet). Stattdessen wird es erst beim
   ersten PDF-Import dynamisch nachgeladen. Die App öffnet dadurch
   sofort — komplett ohne Internetverbindung.
   Beim ersten PDF-Import wird einmalig Internet benötigt.
   Danach cached Safari die Bibliothek automatisch.
═══════════════════════════════════════════════════════════════ */
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const WORKER_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let _pdfReady = false;

function setupPdfWorker() {
  try {
    const b = new Blob([`importScripts('${WORKER_CDN}');`], {type:'text/javascript'});
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(b);
  } catch(e) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_CDN;
  }
}

function loadPdfJs() {
  return new Promise(resolve => {
    if (_pdfReady && typeof pdfjsLib !== 'undefined') { resolve(true); return; }
    if (typeof pdfjsLib !== 'undefined') { setupPdfWorker(); _pdfReady=true; resolve(true); return; }
    const s = document.createElement('script');
    s.src = PDFJS_CDN;
    s.onload  = () => { setupPdfWorker(); _pdfReady=true; resolve(true); };
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
const COLS=['#ff6b6b','#4dabf7','#69db7c','#ffd43b','#cc5de8',
            '#f783ac','#38d9a9','#a9e34b','#ff922b','#74c0fc',
            '#da77f2','#63e6be','#ffe066','#748ffc'];
const KEY='cs_v4';
let _nid=0;
const uid=()=>'nt_'+Date.now()+'_'+(_nid++);

const S={
  projects:{},pid:null,sid:null,
  tab:'s',ntab:'d',mode:null,mtab:'s',
  ui:{fc:null,q:'',si:0,chipsEdit:false,chipsCollapsed:false,tbCollapsed:{scenes:{},eis:{}}}
};
const isMobile=()=>window.innerWidth<768;
const ap=()=>S.projects[S.pid]||null;
const as=()=>{const p=ap();return p?(p.scripts[S.sid]||null):null;};

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({projects:S.projects,pid:S.pid,sid:S.sid}));}
  catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(d.projects)S.projects=d.projects;
    if(d.pid)S.pid=d.pid;
    if(d.sid)S.sid=d.sid;
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   PDF LOADING
═══════════════════════════════════════════════════════════════ */
async function loadPDF(file,pid){
  setMsg('Öffne PDF …');
  const buf=await file.arrayBuffer();
  setMsg('Initialisiere …');
  const pdf=await pdfjsLib.getDocument({data:buf,useWorkerFetch:false,isEvalSupported:false}).promise;
  setMsg(`Extrahiere Text (${pdf.numPages} Seiten) …`);
  const rows=await extractRows(pdf);
  setMsg(`Parse Drehbuch …`);
  const sid='sc_'+Date.now();
  const sc={id:sid,name:file.name.replace(/\.pdf$/i,''),
    scenes:[],characters:{},recorded:{},notes:{},nurtons:[],wordMarkers:{},noDialogScenes:{}};

  /* Projektweite Farb-Palette: gleiche Rolle = gleiche Farbe in allen Skripten */
  const projPalette={};
  const proj=S.projects[pid];
  if(proj) Object.values(proj.scripts).forEach(existing=>{
    Object.entries(existing.characters).forEach(([name,ch])=>{
      if(!projPalette[name])projPalette[name]=ch.color;
    });
  });

  const stats=parseScript(rows,sc,projPalette);
  autoNurtons(sc);
  tbInit(sc);
  S.projects[pid].scripts[sid]=sc;
  S.sid=sid;
  return stats;
}

async function extractRows(pdf){
  const rows=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent({disableCombineTextItems:false,includeMarkedContent:false});
    const byY=new Map();
    for(const item of tc.items){
      if(!item.str||!item.str.trim())continue;
      const rawY=vp.height-item.transform[5];
      const x=item.transform[4];
      const b=Math.round(rawY/3)*3;
      if(!byY.has(b))byY.set(b,[]);
      byY.get(b).push({str:item.str,x});
    }
    [...byY.entries()].sort(([a],[b])=>a-b).forEach(([,items])=>{
      items.sort((a,b)=>a.x-b.x);
      const text=items.map(i=>i.str).join('').trim();
      if(text)rows.push({text,x:items[0].x,pw:vp.width});
    });
  }
  return rows;
}

/* ═══════════════════════════════════════════════════════════════
   PARSER
═══════════════════════════════════════════════════════════════ */
/* ── Charakternamen normalisieren ─────────────────────────────
   Fasst Doppelnamen zusammen die sich nur durch Sonderzeichen
   oder Zusätze wie CONT'D unterscheiden:
   "ANNA (CONT'D)" → "ANNA",  "DR. SMITH." → "DR. SMITH"       */
function normChar(raw){
  return raw
    .replace(/\s*\(CONT'?D\.?\)\s*$/i,'')  // (CONT'D)
    .replace(/\bCONT'?D\.?\s*$/i,'')        // CONT'D ohne Klammern
    .replace(/\s*\(.*?\)\s*$/g,'')          // alle anderen Klammern am Ende
    .replace(/[.,:;!?]+$/,'')               // Satzzeichen am Ende
    .replace(/\s+/g,' ')
    .trim();
}

/* FIX: \b entfernt — Punkt + Leerzeichen = keine Word-Boundary */
const RE_SCENE=/^(\d+[.):\s]*)?(INT\.|EXT\.|I\/E\.|INT\/EXT\.|INNEN\.?|AUßEN\.?|AUSSEN\.?|INNEN\/AUßEN|INNEN\/AUSSEN)/i;
const RE_TRANS=/^(SCHNITT\s*(ZU)?[:.]?|BLENDE\s*(AUF|AB)?[:.]?|CUT\s+TO\s*:|FADE\s*(IN|OUT|TO)\s*[:.]?|DISSOLVE\s+TO\s*:)/i;
const RE_OFF=/\((V\.?\s*O\.?|O\.?\s*S\.?|OFF|TELEFON|AB)\s*\)/i;

/* projPalette: { "ANNA":"#e05252", ... } — vorhandene Farben aus dem Projekt */
function parseScript(rows,sc,projPalette={}){
  if(!rows.length)return{scenes:0,dialogues:0,mode:'empty'};
  const xs=rows.filter(r=>r.x>4).map(r=>r.x);
  const lm=pctile(xs,8),rm=pctile(xs,92);
  const span=Math.max(rm-lm,50);
  const rx=x=>Math.max(0,Math.min(1,(x-lm)/span));
  const indented=rows.filter(r=>rx(r.x)>0.30).length;
  const hasCols=(indented/rows.length)>0.06;
  const stats=runParser(rows,sc,rx,hasCols,true,projPalette);
  const dlg=sc.scenes.reduce((n,s)=>n+s.lines.filter(l=>l.type==='dialogue').length,0);
  if(sc.scenes.length<2||dlg<3){
    sc.scenes=[];sc.characters={};
    return runParser(rows,sc,rx,hasCols,false,projPalette);
  }
  return stats;
}

function runParser(rows,sc,rx,hasColumns,strict,projPalette={}){
  let ci=0,sid=0,lid=0;
  let cur=null,lchar=null,loff=false;
  const thr=(hasColumns&&strict)?0.28:0.08;

  const addScene=t=>{
    /* Szenennummer beibehalten, nur die doppelte Wiederholung am Ende entfernen.
       "1INT. MIAS REEL - NACHT1" → "1 INT. MIAS REEL - NACHT"
       "1    INT. BÜRO - TAG    1" → "1 INT. BÜRO - TAG"
       "INT. PARK - NACHT"         → "INT. PARK - NACHT"  (keine Änderung) */
    const title=t
      .replace(/\s*\d+\s*$/,'')       // doppelte Szenennummer am Ende entfernen
      .replace(/^(\d+)[.):\s]+/,'$1 ') // "1." / "1   " → "1 " (normalisieren)
      .trim()||t.trim();
    cur={id:sid++,title,lines:[]};
    sc.scenes.push(cur);
    lchar=null;loff=false;
  };
  const addLine=(type,text,char=null,isOff=false)=>{
    if(!cur)addScene('DREHBUCH');
    cur.lines.push({id:lid++,type,text,character:char,isOff});
  };
  /* Projektfarbe nutzen wenn Rolle bereits in anderem Skript vorhanden */
  const ensChar=name=>{
    if(!sc.characters[name])
      sc.characters[name]={color:projPalette[name]||COLS[ci++%COLS.length]};
  };

  for(const row of rows){
    const t=row.text.trim();if(!t)continue;
    const xr=rx(row.x);
    const up=t.toUpperCase();
    const isCaps=t===up&&/[A-ZÄÖÜ]/.test(t);
    if(RE_SCENE.test(t)){addScene(t);continue;}
    if(RE_TRANS.test(t)&&t.length<40){addLine('transition',t);lchar=null;loff=false;continue;}
    if(isCaps&&t.length<55&&t.length>1&&xr>=thr&&!t.startsWith('(')&&!/^\d/.test(t)){
      const off=RE_OFF.test(t);
      /* normChar: entfernt CONT'D, Sonderzeichen, fasst Doppelnamen zusammen */
      const name=normChar(t);
      const blacklisted=/^[\d\s\-–—_.,:;!?]+$/.test(name)||/^(ENDE|THE END|FORTSETZUNG|CONTINUED|MEHR|MORE|\.\.\.)$/i.test(name);
      if(name.length>1&&name.length<50&&!blacklisted){
        ensChar(name);lchar=name;loff=off;
        addLine('character',t,name,off);continue;
      }
    }
    if(/^\(.*\)\s*$/.test(t)&&lchar){addLine('parenthetical',t,lchar);continue;}
    if(lchar){
      const ok=strict?(xr>0.08&&xr<0.92):true;
      if(ok){addLine('dialogue',t,lchar,loff);continue;}
    }
    lchar=null;loff=false;addLine('action',t);
  }
  sc.scenes=sc.scenes.filter(s=>s.lines.length>0);
  const dlg=sc.scenes.reduce((n,s)=>n+s.lines.filter(l=>l.type==='dialogue').length,0);
  return{scenes:sc.scenes.length,dialogues:dlg,mode:strict?'strict':'loose'};
}

function autoNurtons(sc){
  sc.scenes.forEach(scene=>scene.lines.forEach(line=>{
    if(line.type==='dialogue'&&line.isOff){
      sc.nurtons.push({
        id:uid(),type:'dialog',
        sceneId:scene.id,sceneTitle:scene.title,
        character:line.character,text:line.text,refText:'',
        lineId:line.id,isOff:true,auto:true,status:'offen',note:''
      });
    }
  }));
}

function pctile(arr,p){
  if(!arr.length)return 0;
  const s=[...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length*p/100)]||0;
}

/* ═══════════════════════════════════════════════════════════════
   PROJECT MANAGEMENT
═══════════════════════════════════════════════════════════════ */
function newProj(){
  const n=prompt('Projektname:','Neue Serie');if(!n?.trim())return;
  const pid='pr_'+Date.now();
  S.projects[pid]={id:pid,name:n.trim(),created:Date.now(),scripts:{}};
  S.pid=pid;S.sid=null;save();renderAll();
  if(isMobile())setMTab('p');
}
function delProj(pid){
  if(!confirm(`„${S.projects[pid]?.name}" löschen?`))return;
  delete S.projects[pid];
  if(S.pid===pid){const r=Object.keys(S.projects);S.pid=r.length?r[0]:null;S.sid=null;}
  save();renderAll();
}
function renProj(pid){
  const p=S.projects[pid];if(!p)return;
  const n=prompt('Neuer Name:',p.name);if(!n?.trim())return;
  p.name=n.trim();save();renderAll();
}
function delScript(pid,sid){
  const sc=S.projects[pid]?.scripts[sid];if(!sc)return;
  if(!confirm(`„${sc.name}" löschen?`))return;
  delete S.projects[pid].scripts[sid];
  if(S.sid===sid)S.sid=null;
  save();renderAll();
}
function renScript(pid,sid){
  const sc=S.projects[pid]?.scripts[sid];if(!sc)return;
  const n=prompt('Skript-Name:',sc.name);if(!n?.trim())return;
  sc.name=n.trim();save();renderAll();
}
function selScript(pid,sid){
  S.pid=pid;S.sid=sid;S.ui.fc=null;S.ui.q='';S.ui.si=0;S.ui.chipsEdit=false;S.ui.chipsCollapsed=false;
  g('srch').value='';resetModeUI();S.mode=null;
  save();renderAll();
  if(isMobile())setMTab('s');
}
let pendPid=null;
function uploadTo(pid){pendPid=pid;g('fin').click();}
async function handleFile(e){
  const file=e.target.files[0];if(!file)return;
  const pid=pendPid||S.pid;
  if(!pid){alert('Bitte zuerst ein Projekt auswählen.');return;}
  loading(true);
  setMsg('Lade PDF.js …');
  /* PDF.js erst jetzt laden — nicht beim App-Start */
  const pdfOk = await loadPdfJs();
  if(!pdfOk){
    loading(false);
    showToast('PDF-Import benötigt einmalig eine Internetverbindung.\nBitte kurz WLAN aktivieren, dann nochmal versuchen.','err');
    return;
  }
  try{
    const stats=await loadPDF(file,pid);
    save();renderAll();
    const msg=stats.scenes===0
      ?'⚠ Kein Text gefunden. Gescannte PDF?'
      :`✓ ${stats.scenes} Szene${stats.scenes!==1?'n':''} · ${stats.dialogues} Dialogzeilen`
       +(stats.mode==='loose'?'\n⚠ Vereinfachter Erkennungsmodus':'');
    showToast(msg,stats.scenes===0?'err':stats.mode==='loose'?'warn':'ok');
    if(isMobile())setMTab('s');
    wake();
  }catch(err){
    console.error(err);
    showToast('Fehler: '+(err.message||err),'err');
  }
  loading(false);e.target.value='';
}

/* ═══════════════════════════════════════════════════════════════

function addNtDialog(scene,line){
  const sc=as();if(!sc)return;
  const ex=sc.nurtons.find(n=>n.lineId===line.id);
  if(ex){delNurton(ex.id);return;}
  sc.nurtons.push({id:uid(),type:'dialog',sceneId:scene.id,sceneTitle:scene.title,
    character:line.character,text:line.text,refText:'',lineId:line.id,
    isOff:line.isOff||false,auto:false,status:'offen',note:''});
  save();renderScript();renderNtTable();renderBadge();
}
function addNtGerausch(scene,line){
  const sc=as();if(!sc)return;
  const desc=prompt('Geräusch beschreiben:','');if(!desc?.trim())return;
  sc.nurtons.push({id:uid(),type:'gerausch',sceneId:scene.id,sceneTitle:scene.title,
    character:null,text:desc.trim(),refText:line.text,lineId:null,
    isOff:false,auto:false,status:'offen',note:''});
  save();renderNtTable();renderBadge();
}
function delNurton(nid){
  const sc=as();if(!sc)return;
  sc.nurtons=sc.nurtons.filter(n=>n.id!==nid);
  save();renderScript();renderNtTable();renderBadge();
}
function togNtStatus(nid){
  const sc=as();if(!sc)return;
  const n=sc.nurtons.find(n=>n.id===nid);if(!n)return;
  n.status=n.status==='offen'?'erledigt':'offen';
  save();renderNtTable();renderBadge();
}
function updNtNote(nid,v){
  const sc=as();if(!sc)return;
  const n=sc.nurtons.find(n=>n.id===nid);if(n){n.note=v;save();}
}

═══════════════════════════════════════════════════════════════ */
function renderAll(){
  renderHeader();renderTree();renderSceneNav();renderChips();
  renderScript();
  if(S.tab==='n')renderNtTable();
  if(S.tab==='t')renderTonbericht();
  if(isMobile()&&S.mtab==='p')renderProjMobile();
  renderBadge();
}

function renderHeader(){
  const sc=as(),p=ap();
  const title=sc?sc.name:(p?p.name:'CineScript');
  g('nb-title').textContent=title;
  if(sc){
    let tot=0,rec=0;
    sc.scenes.forEach(s=>{
      if(sc.noDialogScenes?.[s.id]){tot+=1;rec+=1;return;}
      s.lines.forEach(l=>{if(l.type==='dialogue'){tot++;if(sc.recorded[l.id])rec++;}});
    });
    const pct=tot?Math.round(rec/tot*100):0;
    g('nb-prog').textContent=pct+'%';
    g('gfill').style.width=pct+'%';
  }else{g('nb-prog').textContent='–';g('gfill').style.width='0%';}
}

/* ── PROJECT TREE (sidebar) */
function renderTree(){
  const tree=g('ptree');tree.innerHTML='';
  Object.values(S.projects).sort((a,b)=>b.created-a.created).forEach(proj=>{
    const sec=mk('div');
    // Project header
    const ph=mk('div','prow'+(S.pid===proj.id?' active':''));
    const icon=mk('span','prow-icon');icon.textContent='📂';
    const nm=mk('span','prow-name');nm.textContent=proj.name;nm.title=proj.name;
    nm.ondblclick=e=>{e.stopPropagation();renProj(proj.id);};
    const acts=mk('div','prow-acts');
    const ab=mk('button');ab.textContent='＋';ab.title='PDF hinzufügen';
    ab.onclick=e=>{e.stopPropagation();uploadTo(proj.id);};
    const db=mk('button','d');db.textContent='✕';db.title='Löschen';
    db.onclick=e=>{e.stopPropagation();delProj(proj.id);};
    acts.append(ab,db);ph.append(icon,nm,acts);
    ph.onclick=()=>{S.pid=proj.id;renderTree();};
    // Scripts
    const sl=mk('div');
    Object.values(proj.scripts).sort((a,b)=>a.name.localeCompare(b.name)).forEach(sc=>{
      const sr=mk('div','srow'+(S.sid===sc.id?' on':''));
      sr.dataset.pid=proj.id;sr.dataset.sid=sc.id;
      const si=mk('span','srow-icon');si.textContent='📄';
      const sn=mk('span','srow-name');sn.textContent=sc.name;sn.title=sc.name;
      const on=(sc.nurtons||[]).filter(n=>n.status==='offen').length;
      const sd=mk('span','srow-del');sd.textContent='✕';
      sd.onclick=e=>{e.stopPropagation();delScript(proj.id,sc.id);};
      sr.append(si,sn);
      if(on){const nb=mk('span','nt-badge');nb.textContent=on;sr.appendChild(nb);}
      sr.appendChild(sd);
      sr.ondblclick=e=>{e.stopPropagation();renScript(proj.id,sc.id);};
      sr.onclick=()=>selScript(proj.id,sc.id);
      sl.appendChild(sr);
    });
    const asc=mk('div','add-sc-btn');asc.textContent='＋ PDF hinzufügen';
    asc.onclick=()=>uploadTo(proj.id);
    sl.appendChild(asc);
    sec.append(ph,sl);tree.appendChild(sec);
  });
  const ap2=mk('div','add-proj-btn');ap2.innerHTML='＋ Neues Projekt';
  ap2.onclick=newProj;tree.appendChild(ap2);
}
