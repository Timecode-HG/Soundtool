/* ── CHAR CHIPS ── mit Bearbeiten-Modus zum Ausblenden von Rollen */
function renderChips(){
  const wrap=g('cwrap');wrap.innerHTML='';
  const sc=as();
  /* chips-bar nur zeigen wenn ein Skript geladen ist */
  const bar=g('chips-bar');
  if(!sc){bar.className='';return;}
  const edit=S.ui.chipsEdit;
  const visible=Object.entries(sc.characters).filter(([,ch])=>!ch.hidden);
  const hiddenCnt=Object.values(sc.characters).filter(ch=>ch.hidden).length;

  /* chips-bar immer einblenden (auch wenn leer) */
  bar.className='visible'+(S.ui.chipsCollapsed?' collapsed':'');
  const icon=g('chips-toggle-icon');
  const lbl=g('chips-toggle-label');
  if(icon)icon.style.transform=S.ui.chipsCollapsed?'rotate(-90deg)':'rotate(0deg)';
  if(lbl){
    const activeLabel=S.ui.fc?` · ${S.ui.fc}`:'';
    lbl.textContent=`Rollen${activeLabel}`;
  }

  /* cwrap collapsed-Klasse synchronisieren */
  wrap.classList.toggle('collapsed',!!S.ui.chipsCollapsed);

  /* ✏ / Fertig-Button */
  const eb=mk('div','cchip');
  eb.style.cssText='flex-shrink:0;color:'+(edit?'var(--blue)':'var(--label3)')
    +';background:'+(edit?'rgba(10,132,255,.15)':'var(--fill2)');
  eb.textContent=edit?'✓ Fertig':'✏';
  eb.title=edit?'Bearbeiten beenden':'Rollen bearbeiten';
  eb.onclick=()=>{S.ui.chipsEdit=!S.ui.chipsEdit;renderChips();};
  wrap.appendChild(eb);

  /* "Alle"-Chip (nur im Normal-Modus) */
  if(!edit){
    const ac=mk('div','cchip'+(S.ui.fc?'':' on'));
    ac.textContent='Alle';ac.style.cssText='color:var(--label2);background:var(--fill2)';
    ac.onclick=()=>{S.ui.fc=null;renderScript();renderChips();};
    wrap.appendChild(ac);
  }

  /* Sichtbare Rollen */
  visible.forEach(([name,ch])=>{
    if(edit){
      /* Im Bearbeiten-Modus: Chip + × zum Ausblenden */
      const cw=mk('div','cchip-wrap');
      const c=mk('div','cchip');
      c.textContent=name.length>12?name.slice(0,11)+'…':name;
      c.style.color=ch.color;c.style.background=ch.color+'28';c.title=name;
      const x=mk('div','cchip-x');x.textContent='×';
      x.title='Rolle ausblenden';
      x.onclick=()=>{
        ch.hidden=true;
        if(S.ui.fc===name)S.ui.fc=null;
        save();renderScript();renderChips();
      };
      cw.append(c,x);wrap.appendChild(cw);
    }else{
      const c=mk('div','cchip'+(S.ui.fc===name?' on':''));
      c.textContent=name.length>12?name.slice(0,11)+'…':name;
      c.style.color=ch.color;c.style.background=ch.color+'28';c.title=name;
      c.onclick=()=>{S.ui.fc=S.ui.fc===name?null:name;renderScript();renderChips();};
      wrap.appendChild(c);
    }
  });

  /* Hinweis auf ausgeblendete Rollen → öffnet Farb-Modal zum Wiederherstellen */
  if(hiddenCnt){
    const hc=mk('div','cchip');
    hc.style.cssText='color:var(--label3);background:var(--fill2);flex-shrink:0';
    hc.textContent=`👁 ${hiddenCnt}`;
    hc.title=`${hiddenCnt} ausgeblendete Rolle(n) – im 🎨-Dialog wiederherstellen`;
    hc.onclick=openMod;
    wrap.appendChild(hc);
  }
}

/* ── SCRIPT VIEW */
function renderScript(){
  const wrap=g('scontent'),sc=as();
  if(!sc){
    wrap.innerHTML=`<div id="welcome">
      <div class="wico">🎬</div><h2>Kein Drehbuch</h2>
      <p>Erstelle ein Projekt und lade ein PDF-Drehbuch.</p>
      <button class="bigbtn" onclick="newProj()">＋ Projekt erstellen</button>
    </div>`;
    renderHeader();return;
  }
  wrap.innerHTML='';
  const q=S.ui.q.toLowerCase(),fc=S.ui.fc;
  const ntlids=new Set((sc.nurtons||[]).filter(n=>n.type==='dialog'&&n.lineId!=null).map(n=>n.lineId));

  if(sc.scenes.length===0){
    wrap.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--label3);line-height:2;font-size:15px">
      ⚠ Keine Szenen erkannt.<br><small style="font-size:13px">Mögliche Ursachen: Gescannte PDF · Verschlüsselt · Ungewöhnliches Format</small>
    </div>`;
    renderHeader();return;
  }

  sc.scenes.forEach(scene=>{
    const d=scene.lines.filter(l=>l.type==='dialogue');
    const r=d.filter(l=>sc.recorded[l.id]).length;
    const p=d.length?r/d.length:0;
    const col=p>=1?'#30d158':p>.5?'#ff9f0a':'#ff453a';

    const sec=mk('div','ssec');sec.id='s'+scene.id;

    const hd=mk('div','shd');
    const isND=!!sc.noDialogScenes?.[scene.id];
    const kdBtn=mk('button','kd-btn'+(isND?' on':''));
    kdBtn.textContent='Kein Dialog';kdBtn.title='Szene ohne Dialog als aufgenommen markieren';
    kdBtn.onclick=e=>{e.stopPropagation();toggleNoDialog(scene.id);};
    hd.innerHTML=`<span>${esc(scene.title)}</span>
      <div class="shd-stats">
        ${isND?'<span style="color:var(--green);font-weight:600">✓ Kein Dialog</span>':`<span>${r}/${d.length}</span>
        <div class="smbar"><div class="smfill" style="width:${p*100}%;background:${col}"></div></div>
        <span>${Math.round(p*100)}%</span>`}
      </div>`;
    hd.appendChild(kdBtn);
    sec.appendChild(hd);

    // Notes
    const hasN=sc.notes[scene.id]?.trim();
    const nb=mk('button','ntog');
    nb.innerHTML=(hasN?'📝 '+sc.notes[scene.id].slice(0,40)+(sc.notes[scene.id].length>40?'…':''):'＋ Notiz');
    const ta=mk('textarea','nta'+(hasN?' open':''));
    ta.placeholder='Continuity, Anweisungen …';ta.value=sc.notes[scene.id]||'';
    ta.oninput=()=>{sc.notes[scene.id]=ta.value;nb.innerHTML=ta.value.trim()?'📝 '+ta.value.slice(0,40):'＋ Notiz';save();};
    nb.onclick=()=>ta.classList.toggle('open');
    sec.append(nb,ta);

    let hasVis=false;

    /* ── Passage-Erkennung: zusammenhängende Dialogzeilen gleicher Figur ── */
    const visLines=scene.lines.filter(line=>{
      if(fc&&(line.type==='action'||line.type==='transition'))return false;
      if(fc&&line.character&&line.character!==fc)return false;
      if(q&&!line.text.toLowerCase().includes(q))return false;
      return true;
    });
    const passageMap={};     /* lineId → groupId */
    const passageData={};    /* groupId → {lineIds:[]} */
    let curChar=null,curIds=[],pgCtr=0;
    const flushGroup=()=>{
      if(curIds.length>=2){
        const gid='pg_'+pgCtr++;
        curIds.forEach(id=>{passageMap[id]=gid;});
        passageData[gid]={lineIds:[...curIds]};
      }
      curChar=null;curIds=[];
    };
    visLines.forEach(line=>{
      if(line.type==='dialogue'){
        if(line.character===curChar){curIds.push(line.id);}
        else{flushGroup();curChar=line.character;curIds=[line.id];}
      } else if(line.type==='action'||line.type==='transition'){
        flushGroup();
      }
      /* character/parenthetical brechen Passage nicht */
    });
    flushGroup();
    const renderedPGs=new Set();

    visLines.forEach(line=>{
      hasVis=true;

      /* Passage-Button vor dem ersten Element der Gruppe */
      const gid=passageMap[line.id];
      if(gid&&!renderedPGs.has(gid)){
        renderedPGs.add(gid);
        const pg=passageData[gid];
        const allRec=pg.lineIds.every(id=>sc.recorded[id]);
        const pbtn=mk('button','passage-all-btn'+(allRec?' all-done':''));
        pbtn.textContent=allRec?'✓ Passage vollständig aufgenommen':'▶ Passage als aufgenommen markieren';
        pbtn.title=`${pg.lineIds.length} aufeinanderfolgende Zeilen als Gruppe abhaken`;
        pbtn.onclick=()=>{
          pg.lineIds.forEach(id=>{if(allRec)delete sc.recorded[id];else sc.recorded[id]=true;});
          save();renderScript();renderSceneNav();renderHeader();
        };
        sec.appendChild(pbtn);
      }

      const div=mk('div','ln ln-'+line.type);
      if(line.type==='character'){
        const ch=sc.characters[line.character];
        if(ch)div.style.color=ch.color;
        if(line.isOff){const b=mk('span','off-badge');b.textContent='OFF';div.appendChild(b);}
      }
      if(line.type==='dialogue'){
        const ch=sc.characters[line.character];
        if(ch)div.style.borderLeftColor=ch.color;
        const isNt=ntlids.has(line.id);
        if(isNt)div.classList.add('isnt');
        if(sc.recorded[line.id])div.classList.add('rec');
        if(line.isOff)div.classList.add('isoff');
        if(S.mode==='g')div.classList.add('gclk');
        if(S.mode==='w')div.classList.add('wclk');
        div.onclick=(e)=>{
          if(S.mode==='w'){
            const ws=e.target.closest('[data-wkey]');
            if(ws)toggleWordMarker(ws.dataset.wkey);
            return;
          }
          if(S.mode==='d')addNtDialog(scene,line);
          else if(S.mode==='g')addNtGerausch(scene,line);
          else togRec(line.id);
        };
        if(isNt){
          const ico=mk('span','ntlbl');ico.textContent='🎙';ico.title='Entfernen';
          ico.onclick=e=>{e.stopPropagation();const n=sc.nurtons.find(n=>n.lineId===line.id);if(n)delNurton(n.id);};
          div.appendChild(ico);
        }
        attachLP(div,()=>showAS(scene,line));
      }
      if(line.type==='action'&&S.mode==='g'){
        div.classList.add('gclk');div.onclick=()=>addNtGerausch(scene,line);
      }
      const sp=document.createElement('span');
      if(line.type==='dialogue'){
        const hasWM=sc.wordMarkers&&Object.keys(sc.wordMarkers).some(k=>k.startsWith(line.id+'_'));
        if(S.mode==='w'||hasWM){
          buildWordSpans(sp,line.text,line.id,sc,q);
        } else {
          sp.innerHTML=q?hilite(esc(line.text),q):esc(line.text);
        }
      } else {
        sp.innerHTML=q?hilite(esc(line.text),q):esc(line.text);
      }
      div.insertBefore(sp,div.firstChild);
      sec.appendChild(div);
    });
    if(!q||hasVis)wrap.appendChild(sec);
  });
  renderHeader();
}

/* ── NURTON TABLE (Karten mobil · Tabelle Desktop) — nach Szenen gruppiert */
function renderNtTable(){
  const wrap=g('ncontent'),sc=as();
  if(!sc){wrap.innerHTML='<p style="padding:20px;color:var(--label3)">Kein Drehbuch geladen.</p>';return;}
  const typ=S.ntab==='d'?'dialog':'gerausch';
  const nts=(sc.nurtons||[]).filter(n=>n.type===typ);
  wrap.innerHTML='';

  // Stats-Leiste
  const stats=mk('div','ntstats');
  const open=nts.filter(n=>n.status==='offen').length;
  const done=nts.filter(n=>n.status==='erledigt').length;
  stats.innerHTML=`<span class="nts o">● ${open} offen</span>
    <span class="nts d">✓ ${done} erledigt</span>
    <span class="nts t">${nts.length}</span>`;
  wrap.appendChild(stats);

  if(!nts.length){
    const em=mk('div','ntempty');
    em.innerHTML=typ==='dialog'
      ?'🎙 Keine Dialog-Nurtöne<br><small>Dialog-Marker aktivieren und Zeilen antippen.<br>(OFF)/(V.O.)-Zeilen werden automatisch erfasst.</small>'
      :'🔊 Keine Geräusche<br><small>Geräusch-Marker aktivieren und Aktionszeilen antippen.</small>';
    wrap.appendChild(em);return;
  }

  /* Nurtöne nach Szene gruppieren — Reihenfolge aus sc.scenes beibehalten */
  const sceneOrder=sc.scenes.map(s=>s.id);
  const groups=new Map();
  nts.forEach(n=>{
    if(!groups.has(n.sceneId))groups.set(n.sceneId,{title:n.sceneTitle,items:[]});
    groups.get(n.sceneId).items.push(n);
  });
  const sortedGroups=[...groups.entries()]
    .sort(([a],[b])=>{
      const ia=sceneOrder.indexOf(a), ib=sceneOrder.indexOf(b);
      return (ia<0?9999:ia)-(ib<0?9999:ib);
    });

  /* Globaler Zähler über alle Szenen */
  let globalIdx=0;

  /* ── MOBILE: Karten ── */
  const cards=mk('div','nt-cards');

  sortedGroups.forEach(([sceneId,group])=>{
    const grpOpen=group.items.filter(n=>n.status==='offen').length;
    const grpDone=group.items.filter(n=>n.status==='erledigt').length;
    const grpTotal=group.items.length;
    const pct=grpTotal?Math.round(grpDone/grpTotal*100):0;

    /* Szenen-Gruppenheader */
    const hd=mk('div','nt-grp-hd');
    hd.innerHTML=`<span>${esc(group.title)}</span>
      <div class="nt-grp-prog">
        <span class="nt-grp-prog-done">✓${grpDone}</span>
        <span class="nt-grp-prog-open">○${grpOpen}</span>
        <div class="nt-grp-bar"><div class="nt-grp-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    cards.appendChild(hd);

    group.items.forEach(n=>{
      globalIdx++;
      const ch=sc.characters[n.character];
      const cc=ch?ch.color:'var(--label3)';
      const card=mk('div','nt-card'+(n.status==='erledigt'?' done':''));
      const top=mk('div','nt-card-top');
      const char=mk('span','nt-card-char');char.textContent=n.character||'—';char.style.color=cc;
      const numsp=mk('span');numsp.textContent='#'+globalIdx;numsp.style.cssText='font-size:10px;color:var(--label4);margin-left:auto;flex-shrink:0';
      const badges=mk('div','nt-badges');
      const b1=mk('span','badge '+(n.auto?'auto':'man'));b1.textContent=n.auto?'AUTO':'MARKER';
      badges.appendChild(b1);
      if(n.isOff){const b2=mk('span','badge off');b2.textContent='OFF';badges.appendChild(b2);}
      top.append(char,badges,numsp);
      const text=mk('div','nt-card-text');text.textContent=n.text;
      const bottom=mk('div','nt-card-bottom');
      const stbtn=mk('button','stbtn '+n.status);
      stbtn.textContent=n.status==='erledigt'?'✓ Erledigt':'○ Offen';
      stbtn.onclick=()=>togNtStatus(n.id);
      const note=mk('input','nt-note');note.type='text';note.value=n.note||'';
      note.placeholder='Notiz …';note.onchange=e=>updNtNote(n.id,e.target.value);
      const del=mk('button','nt-del-btn');del.textContent='✕';del.onclick=()=>delNurton(n.id);
      bottom.append(stbtn,note,del);
      card.append(top,text,bottom);
      cards.appendChild(card);
    });
  });
  wrap.appendChild(cards);

  /* ── DESKTOP: Tabelle ── */
  const tw=mk('div','ntbl-wrap');
  const tbl=document.createElement('table');tbl.className='nttbl';
  const cols=typ==='dialog'?8:7;
  tbl.innerHTML=typ==='dialog'
    ?'<thead><tr><th>#</th><th>Rolle</th><th>Dialog</th><th>Typ</th><th>Status</th><th>Notiz</th><th></th></tr></thead>'
    :'<thead><tr><th>#</th><th>Geräusch</th><th>Referenz</th><th>Status</th><th>Notiz</th><th></th></tr></thead>';
  const tbody=document.createElement('tbody');
  let tblIdx=0;

  sortedGroups.forEach(([sceneId,group])=>{
    const grpOpen=group.items.filter(n=>n.status==='offen').length;
    const grpDone=group.items.filter(n=>n.status==='erledigt').length;

    /* Szenen-Trennzeile */
    const sep=mk('tr','nt-sep-row');
    sep.innerHTML=`<td colspan="${cols}">${esc(group.title)}
      <span class="nt-sep-stats">✓${grpDone} erledigt · ○${grpOpen} offen</span></td>`;
    tbody.appendChild(sep);

    group.items.forEach(n=>{
      tblIdx++;
      const tr=mk('tr',n.status==='erledigt'?'done':'');
      const ch=sc.characters[n.character];const cc=ch?ch.color:'var(--label3)';
      if(typ==='dialog'){
        tr.innerHTML=`
          <td class="td-num">${tblIdx}</td>
          <td class="td-char" style="color:${cc}">${esc(n.character||'–')}</td>
          <td class="td-text">${esc(n.text)}</td>
          <td>${n.auto?'<span class="badge auto">AUTO</span>':'<span class="badge man">MARKER</span>'}${n.isOff?'<span class="badge off">OFF</span>':''}</td>
          <td><button class="stbtn ${n.status}" onclick="togNtStatus('${n.id}')">${n.status==='erledigt'?'✓ Erledigt':'○ Offen'}</button></td>
          <td><input class="td-note" value="${esc(n.note||'')}" placeholder="Notiz…" onchange="updNtNote('${n.id}',this.value)"></td>
          <td><button class="td-del" onclick="delNurton('${n.id}')">✕</button></td>`;
      }else{
        tr.innerHTML=`
          <td class="td-num">${tblIdx}</td>
          <td class="td-text">${esc(n.text)}</td>
          <td class="td-ref" title="${esc(n.refText||'')}">${esc((n.refText||'').slice(0,36))}${(n.refText||'').length>36?'…':''}</td>
          <td><button class="stbtn ${n.status}" onclick="togNtStatus('${n.id}')">${n.status==='erledigt'?'✓ Erledigt':'○ Offen'}</button></td>
          <td><input class="td-note" value="${esc(n.note||'')}" placeholder="Notiz…" onchange="updNtNote('${n.id}',this.value)"></td>
          <td><button class="td-del" onclick="delNurton('${n.id}')">✕</button></td>`;
      }
      tbody.appendChild(tr);
    });
  });
  tbl.appendChild(tbody);tw.appendChild(tbl);wrap.appendChild(tw);
}

  addP.onclick=newProj;scroll.appendChild(addP);

  /* Backup-Karte am Ende der mobilen Projektansicht */
  const bkCard=mk('div','proj-bk-card');

  const scriptCnt=Object.values(S.projects).reduce((n,p)=>n+Object.keys(p.scripts).length,0);
  bkInfo.innerHTML=
    `<strong style="color:var(--label)">${projCnt} Projekt${projCnt!==1?'e':''}</strong> · `+
    `<strong style="color:var(--label)">${scriptCnt} Drehbuch${scriptCnt!==1?'bücher':''}</strong>`+
    `<br>Alle Daten (Szenen, Nurtöne, Markierungen, Notizen) als .json sichern`+
    `<br><span style="color:var(--red)">⚠ Achtung:</span> Browser-Daten löschen entfernt alles — regelmäßig sichern!`;

}

/* ═══════════════════════════════════════════════════════════════
   TONBERICHT — Sound Report
   Drehtage · Einstellungen A–Z · Takes · Dialog- & Geräusch-Kriterien
═══════════════════════════════════════════════════════════════ */
const TB_SAMPLERATES=['44100','48000','88200','96000','192000'];
const TB_BITDEPTHS=['16','24','32'];
const TB_DEFAULT_NOISE=[
  'Flugzeug','Sirene','Wind','Stimmen','Klimaanlage',
  'Schritte','Kameramotor','Handy/Vibration','Hund/Tiere','Regen',
  'Verkehr','Tür/Knarren','Elektrisches Brummen','Schmuck/Kleidung'
];

/* ── Initialisierung ─────────────────────────────────────────── */
function tbInit(sc){
  const p=ap();
  /* ── Projekt-Level: Drehtage + customNoise ───────────────────── */
  if(p){
    if(!p.drehtage)p.drehtage={};
    if(!p.customNoise)p.customNoise=[];
    /* Migration script-level → projekt-level (einmalig) */
    if(sc.tonbericht?.drehtage&&Object.keys(sc.tonbericht.drehtage).length>0){
      Object.assign(p.drehtage,sc.tonbericht.drehtage);
      sc.tonbericht.drehtage={};
    }
    if(sc.tonbericht?.customNoise?.length>0){
      sc.tonbericht.customNoise.forEach(n=>{if(!p.customNoise.includes(n))p.customNoise.push(n);});
      sc.tonbericht.customNoise=[];
    }
  }
  /* ── Script-Level ────────────────────────────────────────────── */
  if(!sc.tonbericht)sc.tonbericht={sceneData:{},projekt:{kuerzel:'',typ:'film',episode:'',eiConvention:'letters'},sceneLabels:{}};
  if(!sc.tonbericht.projekt)sc.tonbericht.projekt={kuerzel:'',typ:'film',episode:'',eiConvention:'letters'};
  if(!sc.tonbericht.projekt.eiConvention)sc.tonbericht.projekt.eiConvention='letters';
  if(!sc.tonbericht.sceneLabels)sc.tonbericht.sceneLabels={};
  sc.scenes.forEach(scene=>{
    if(!sc.tonbericht.sceneData[scene.id])
      sc.tonbericht.sceneData[scene.id]={drehtag_id:null,sceneChars:null,einstellungen:tbDefaultEinstellungen(scene,sc),teilstuecke:[],nurtonTakes:[]};
    const sd=sc.tonbericht.sceneData[scene.id];
    if(!('sceneChars' in sd))sd.sceneChars=null;
    if(!sd.teilstuecke)sd.teilstuecke=[];
    if(!sd.nurtonTakes)sd.nurtonTakes=[];
    /* Kanal + Flag-Migration */
    const migrateEi=ei=>{
      if(typeof ei.kanal==='string')ei.kanal=ei.kanal?[ei.kanal]:[];
      if(ei.isMOS===undefined)ei.isMOS=false;
      if(ei.isSlowMo===undefined)ei.isSlowMo=false;
    };
    sd.einstellungen.forEach(migrateEi);
    sd.teilstuecke.forEach(ts=>(ts.einstellungen||[]).forEach(migrateEi));
  });
}
function tbDefaultEinstellungen(scene,sc){
  const chars=tbSceneChars(scene,sc);
  return ['A','B','C','D','E'].map((letter,i)=>({
    id:'ei_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),
    letter,kanal:[],isPU:false,isVariante:false,teilstueck:0,isMOS:false,isSlowMo:false,
    activeChars:Object.fromEntries(chars.map(c=>[c,true])),
    takes:[]
  }));
}
function tbSceneChars(scene,sc){
  const set=new Set();
  scene.lines.forEach(l=>{if((l.type==='dialogue'||l.type==='character')&&l.character)set.add(l.character);});
  return [...set];
}
/* Effektive Rollen einer Szene: auto-erkannt + manuell ergänzt/entfernt */
function tbSceneCharsEffective(scene,sc,sd){
  const auto=tbSceneChars(scene,sc);
  if(!sd?.sceneChars)return auto;
  const added=sd.sceneChars.added||[];
  const removed=new Set(sd.sceneChars.removed||[]);
  return [...new Set([...auto.filter(c=>!removed.has(c)),...added])];
}
function tbAddSceneChar(sceneId,charName){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  if(!sd.sceneChars)sd.sceneChars={added:[],removed:[]};
  /* Aus removed entfernen falls vorhanden */
  sd.sceneChars.removed=(sd.sceneChars.removed||[]).filter(c=>c!==charName);
  /* Zu added hinzufügen wenn nicht schon auto-erkannt */
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const autoChars=scene?tbSceneChars(scene,sc):[];
  if(!autoChars.includes(charName)&&!sd.sceneChars.added.includes(charName))
    sd.sceneChars.added.push(charName);
  /* Alle Einstellungen erhalten den neuen Char (default: aktiv) */
  sd.einstellungen.forEach(ei=>{
    if(!(charName in (ei.activeChars||{})))ei.activeChars[charName]=true;
  });
  save();renderTonbericht();
}
function tbRemoveSceneChar(sceneId,charName){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  if(!sd.sceneChars)sd.sceneChars={added:[],removed:[]};
  /* Aus added entfernen */
  sd.sceneChars.added=(sd.sceneChars.added||[]).filter(c=>c!==charName);
  /* Zu removed hinzufügen wenn auto-erkannt */
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const autoChars=scene?tbSceneChars(scene,sc):[];
  if(autoChars.includes(charName)&&!(sd.sceneChars.removed||[]).includes(charName))
    sd.sceneChars.removed.push(charName);
  /* Aus allen Einstellungen activeChars entfernen */
  sd.einstellungen.forEach(ei=>{delete ei.activeChars[charName];});
  save();renderTonbericht();
}
function tbResetSceneChars(sceneId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  sd.sceneChars=null;
  /* activeChars in Einstellungen zurücksetzen auf auto-erkannte */
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const autoChars=scene?tbSceneChars(scene,sc):[];
  sd.einstellungen.forEach(ei=>{
    ei.activeChars=Object.fromEntries(autoChars.map(c=>[c,ei.activeChars[c]!==false]));
  });
  save();renderTonbericht();
}
function tbGetSD(sc,sceneId){
  tbInit(sc);
  if(!sc.tonbericht.sceneData[sceneId]){
    const scene=sc.scenes.find(s=>s.id===sceneId);
    if(!scene)return null;
    sc.tonbericht.sceneData[sceneId]={drehtag_id:null,sceneChars:null,einstellungen:tbDefaultEinstellungen(scene,sc),teilstuecke:[],nurtonTakes:[]};
  }
  return sc.tonbericht.sceneData[sceneId];
}

/* ── Drehtag CRUD ────────────────────────────────────────────── */
function tbNewDrehtag(){
  const sc=as();if(!sc)return;
  const p=ap();if(!p)return;
  tbInit(sc);
  const existingDts=Object.values(p.drehtage||{});
  const id='dt_'+Date.now();
  const num=existingDts.length+1;
  let newDt={id,datum:'',drehtag:String(num),tonmeister:'',telefon:'',email:'',mikrofon:'',samplerate:'48000',bitdepth:'24'};
  /* Daten vom letzten Drehtag anbieten */
  if(existingDts.length>0){
    const last=existingDts[existingDts.length-1];
    const hasData=last.tonmeister||last.mikrofon;
    if(hasData){
      const lines=[
        `Drehtag ${last.drehtag||'–'}${last.datum?' ('+last.datum+')':''}`,
        last.tonmeister?`Tonmeister: ${last.tonmeister}`:'',
        last.mikrofon?`Mikrofon: ${last.mikrofon}`:'',
        `Format: ${last.samplerate} Hz · ${last.bitdepth} Bit`
      ].filter(Boolean).join('\n');
      if(confirm(`Daten vom letzten Drehtag übernehmen?\n\n${lines}`)){
        newDt.tonmeister=last.tonmeister;
        newDt.telefon=last.telefon||'';
        newDt.email=last.email||'';
        newDt.mikrofon=last.mikrofon;
        newDt.samplerate=last.samplerate;
        newDt.bitdepth=last.bitdepth;
      }
    }
  }
  p.drehtage[id]=newDt;
  save();renderTonbericht();
}
function tbDelDrehtag(id){
  const sc=as(),p=ap();if(!sc||!p)return;
  if(!confirm('Drehtag löschen?'))return;
  delete p.drehtage[id];
  Object.values(sc.tonbericht.sceneData).forEach(sd=>{if(sd.drehtag_id===id)sd.drehtag_id=null;});
  save();renderTonbericht();
}
function tbUpdateDrehtag(id,field,val){
  const p=ap();if(!p)return;
  if(p.drehtage[id]){p.drehtage[id][field]=val;save();}
}
function tbAssignDrehtag(sceneId,dtId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);
  if(sd){sd.drehtag_id=dtId||null;save();}
}

/* ── Einstellung CRUD ────────────────────────────────────────── */
function tbAddEi(sceneId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);
  const used=sd.einstellungen.map(e=>e.letter);
  const next='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l=>!used.includes(l));
  if(!next){showToast('Maximum (26) Einstellungen erreicht','warn');return;}
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const chars=scene?tbSceneChars(scene,sc):[];
  sd.einstellungen.push({
    id:'ei_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    letter:next,kanal:[],isPU:false,isVariante:false,teilstueck:0,isMOS:false,isSlowMo:false,
    activeChars:Object.fromEntries(chars.map(c=>[c,true])),
    takes:[]
  });
  save();renderTonbericht();
}
function tbRemEi(sceneId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);
  if(!sd.einstellungen.length){showToast('Keine Einstellungen vorhanden','warn');return;}
  const last=sd.einstellungen[sd.einstellungen.length-1];
  if(last.takes.length>0&&!confirm(`Einstellung ${last.letter} hat ${last.takes.length} Take(s). Löschen?`))return;
  sd.einstellungen.pop();
  save();renderTonbericht();
}
/* ── Einstellung in allen Gruppen finden ─────────────────────── */
function tbGetEi(sc,sceneId,eiId){
  const sd=tbGetSD(sc,sceneId);if(!sd)return null;
  let ei=(sd.einstellungen||[]).find(e=>e.id===eiId);if(ei)return ei;
  for(const ts of (sd.teilstuecke||[])){
    ei=(ts.einstellungen||[]).find(e=>e.id===eiId);if(ei)return ei;
  }
  return null;
}
/* Alle Einstellungen einer Szene (haupt + teilstücke) */
function tbAllEis(sd){
  return [...(sd.einstellungen||[]),...(sd.teilstuecke||[]).flatMap(ts=>ts.einstellungen||[])];
}

function tbToggleChar(sceneId,eiId,charName){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  ei.activeChars[charName]=!ei.activeChars[charName];
  save();renderTonbericht();
}
function tbToggleKanal(sceneId,eiId,kanalName){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  if(!Array.isArray(ei.kanal))ei.kanal=[];
  const i=ei.kanal.indexOf(kanalName);
  if(i>=0)ei.kanal.splice(i,1);else ei.kanal.push(kanalName);
  save();renderTonbericht();
}

/* ── Take CRUD ───────────────────────────────────────────────── */
function tbAddTake(sceneId,eiId){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  ei.takes.push({
    id:'tk_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    nummer:ei.takes.length+1,label:'',sterne:0,isBest:false,
    dialog:{verstaendlichkeit:null,textabweichung:false,rascheln:false,ueberlappen:false,
      versprecher:false,atemgeraeusch:false,hallecho:false,rauschen:false},
    stoergeraeusche:[],kommentar:''
  });
  save();renderTonbericht();
}
function tbDelTake(sceneId,eiId,tkId){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  ei.takes=ei.takes.filter(t=>t.id!==tkId);
  ei.takes.forEach((t,i)=>t.nummer=i+1);
  save();renderTonbericht();
}
function tbUpdTake(sceneId,eiId,tkId,field,val){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  const tk=ei.takes.find(t=>t.id===tkId);if(!tk)return;
  if(field.startsWith('d.'))tk.dialog[field.slice(2)]=val;
  else tk[field]=val;
  save();
}
function tbSetSterne(sceneId,eiId,tkId,val){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  const tk=ei.takes.find(t=>t.id===tkId);if(!tk)return;
  tk.sterne=tk.sterne===val?0:val;
  save();renderTonbericht();
}
function tbToggleBest(sceneId,eiId,tkId){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  const tk=ei.takes.find(t=>t.id===tkId);if(!tk)return;
  tk.isBest=!tk.isBest;
  save();renderTonbericht();
}
function tbReorderTake(sceneId,eiId,tkId,dir){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  const i=ei.takes.findIndex(t=>t.id===tkId);if(i<0)return;
  const ni=i+dir;if(ni<0||ni>=ei.takes.length)return;
  [ei.takes[i],ei.takes[ni]]=[ei.takes[ni],ei.takes[i]];
  ei.takes.forEach((t,idx)=>t.nummer=idx+1);
  save();renderTonbericht();
}
function tbMoveTake(sceneId,fromEiId,tkId,toEiId){
  if(fromEiId===toEiId)return;
  const sc=as();if(!sc)return;
  const fromEi=tbGetEi(sc,sceneId,fromEiId);if(!fromEi)return;
  const toEi=tbGetEi(sc,sceneId,toEiId);if(!toEi)return;
  const idx=fromEi.takes.findIndex(t=>t.id===tkId);if(idx<0)return;
  const [tk]=fromEi.takes.splice(idx,1);
  fromEi.takes.forEach((t,i)=>t.nummer=i+1);
  tk.nummer=toEi.takes.length+1;
  toEi.takes.push(tk);
  save();renderTonbericht();
}
function tbToggleNoise(sceneId,eiId,tkId,noise){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  const tk=ei.takes.find(t=>t.id===tkId);if(!tk)return;
  const i=tk.stoergeraeusche.indexOf(noise);
  if(i>=0)tk.stoergeraeusche.splice(i,1);else tk.stoergeraeusche.push(noise);
  save();renderTonbericht();
}
function tbAddCustomNoise(sceneId,eiId,tkId,noise){
  const sc=as(),p=ap();if(!sc||!p)return;
  noise=noise.trim();if(!noise)return;
  if(!p.customNoise)p.customNoise=[];
  if(p.customNoise.some(n=>n.toLowerCase()===noise.toLowerCase())||
     TB_DEFAULT_NOISE.some(n=>n.toLowerCase()===noise.toLowerCase())){
    showToast('Störgeräusch existiert bereits','warn');return;
  }
  p.customNoise.push(noise);
  tbToggleNoise(sceneId,eiId,tkId,noise);
}
function tbRemoveCustomNoise(noise){
  const sc=as(),p=ap();if(!sc||!p)return;
  p.customNoise=(p.customNoise||[]).filter(n=>n!==noise);
  /* Auch aus allen Takes aller Skripte dieses Projekts entfernen */
  Object.values(S.projects[S.pid]?.scripts||{}).forEach(script=>{
    Object.values(script.tonbericht?.sceneData||{}).forEach(sd=>{
      tbAllEis(sd).forEach(ei=>{
        ei.takes.forEach(tk=>{
          tk.stoergeraeusche=(tk.stoergeraeusche||[]).filter(s=>s!==noise);
        });
      });
    });
  });
  save();renderTonbericht();
}
function tbUpdProjekt(field,val){
  const sc=as();if(!sc)return;
  tbInit(sc);
  sc.tonbericht.projekt[field]=val;
  save();renderTonbericht();
}
/* ── Namens-Schema ───────────────────────────────────────────── */
function tbGetKuerzel(sc){
  return ((sc.tonbericht.projekt||{}).kuerzel||'???').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)||'???';
}
function tbSceneNum(sc,sceneId){
  /* Benutzerdefiniertes Label bevorzugen */
  const custom=sc.tonbericht?.sceneLabels?.[sceneId];
  if(custom&&String(custom).trim())return String(custom).trim();
  const idx=sc.scenes.findIndex(s=>s.id===sceneId);
  return String(idx+1).padStart(2,'0');
}
function tbGetEiLabel(ei,convention){
  /* convention: 'letters' (A,B,C) oder 'numbers' (1,2,3) */
  if(!convention||convention==='letters')return ei.letter||'A';
  /* Buchstabe → Zahl: A=1, B=2 … */
  return String((ei.letter||'A').charCodeAt(0)-64);
}
function tbBuildEiName(sc,sceneId,ei){
  const letter=typeof ei==='string'?ei:(ei.letter||'?');
  const isPU=typeof ei==='object'&&ei.isPU;
  const isV=typeof ei==='object'&&ei.isVariante;
  const ts=typeof ei==='object'&&ei.teilstueck>0?`T${ei.teilstueck}`:'';
  const convention=sc.tonbericht?.projekt?.eiConvention||'letters';
  const label=typeof ei==='object'?tbGetEiLabel(ei,convention):letter;
  const flagSuffix=(isV?'v':'')+(isPU?'-PU':'');
  const p=sc.tonbericht.projekt||{};
  const k=tbGetKuerzel(sc);
  const sn=tbSceneNum(sc,sceneId)+(ts?ts:'');
  if(p.typ==='serie'&&String(p.episode||'').trim()){
    const ep=String(p.episode).trim().padStart(2,'0');
    return `${k}-${ep}-${sn}-${label}${flagSuffix}`;
  }
  return `${k}-${sn}-${label}${flagSuffix}`;
}
function tbBuildTakeName(sc,sceneId,ei,takeNummer){
  return tbBuildEiName(sc,sceneId,ei)+'T'+String(takeNummer).padStart(2,'0');
}
function tbCopyName(name,btn){
  navigator.clipboard?.writeText(name).then(()=>{
    const orig=btn.textContent;btn.textContent='✓';
    setTimeout(()=>btn.textContent=orig,1200);
  }).catch(()=>{});
}
function tbToggleSceneCollapse(sceneId){
  if(!S.ui.tbCollapsed)S.ui.tbCollapsed={scenes:{},eis:{}};
  S.ui.tbCollapsed.scenes[sceneId]=!S.ui.tbCollapsed.scenes[sceneId];
  renderTonbericht();
}
function tbToggleEiCollapse(eiId){
  if(!S.ui.tbCollapsed)S.ui.tbCollapsed={scenes:{},eis:{},takes:{}};
  if(!S.ui.tbCollapsed.eis)S.ui.tbCollapsed.eis={};
  /* Standard=offen: undefined/false → true(zu), true → false(auf) */
  S.ui.tbCollapsed.eis[eiId]=S.ui.tbCollapsed.eis[eiId]!==true;
  renderTonbericht();
}
function tbToggleEiFlag(sceneId,eiId,flag){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  ei[flag]=!ei[flag];
  save();renderTonbericht();
}
function tbSetTeilstueck(sceneId,eiId,val){
  const sc=as();if(!sc)return;
  const ei=tbGetEi(sc,sceneId,eiId);if(!ei)return;
  ei.teilstueck=Math.max(0,parseInt(val)||0);
  save();renderTonbericht();
}

/* ── Teilstück-Gruppen CRUD ──────────────────────────────────── */
function tbAddTeilstueck(sceneId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const nums=(sd.teilstuecke||[]).map(t=>t.nummer);
  const next=(nums.length?Math.max(...nums):0)+1;
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const chars=scene?tbSceneCharsEffective(scene,sc,sd):[];
  const eis=['A','B','C','D','E'].map((letter,i)=>({
    id:'ei_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),
    letter,kanal:[],isPU:false,isVariante:false,teilstueck:next,isMOS:false,isSlowMo:false,
    activeChars:Object.fromEntries(chars.map(c=>[c,true])),takes:[]
  }));
  sd.teilstuecke.push({id:'ts_'+Date.now(),nummer:next,einstellungen:eis});
  save();renderTonbericht();
}
function tbRemTeilstueck(sceneId,tsId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const ts=(sd.teilstuecke||[]).find(t=>t.id===tsId);
  if(ts&&ts.einstellungen.some(e=>e.takes.length>0)&&!confirm('Teilstück hat Takes. Wirklich löschen?'))return;
  sd.teilstuecke=(sd.teilstuecke||[]).filter(t=>t.id!==tsId);
  save();renderTonbericht();
}
function tbAddEiToTs(sceneId,tsId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const ts=(sd.teilstuecke||[]).find(t=>t.id===tsId);if(!ts)return;
  const used=ts.einstellungen.map(e=>e.letter);
  const next='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l=>!used.includes(l));
  if(!next){showToast('Maximum (26) Einstellungen erreicht','warn');return;}
  const scene=sc.scenes.find(s=>s.id===sceneId);
  const chars=scene?tbSceneCharsEffective(scene,sc,sd):[];
  ts.einstellungen.push({
    id:'ei_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    letter:next,kanal:[],isPU:false,isVariante:false,teilstueck:ts.nummer,isMOS:false,isSlowMo:false,
    activeChars:Object.fromEntries(chars.map(c=>[c,true])),takes:[]
  });
  save();renderTonbericht();
}
function tbRemEiFromTs(sceneId,tsId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const ts=(sd.teilstuecke||[]).find(t=>t.id===tsId);if(!ts)return;
  if(!ts.einstellungen.length){showToast('Keine Einstellungen vorhanden','warn');return;}
  const last=ts.einstellungen[ts.einstellungen.length-1];
  if(last.takes.length>0&&!confirm(`Einstellung ${last.letter} hat ${last.takes.length} Take(s). Löschen?`))return;
  ts.einstellungen.pop();
  save();renderTonbericht();
}

/* ── Nurtöne pro Szene ───────────────────────────────────────── */
function tbAddNurtonItem(sceneId){
  const sc=as();if(!sc)return;

  sd.nurtonTakes.push({id:'nt_'+Date.now(),name:'Atmo',takes:[]});

}
function tbDelNurtonItem(sceneId,ntId){

function tbUpdateNurtonName(sceneId,ntId,name){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const nt=sd.nurtonTakes.find(n=>n.id===ntId);if(nt)nt.name=name;save();

function tbAddNurtonTake(sceneId,ntId){
  const sc=as();if(!sc)return;
  const sd=tbGetSD(sc,sceneId);if(!sd)return;
  const nt=sd.nurtonTakes.find(n=>n.id===ntId);if(!nt)return;

function tbDelNurtonTake(sceneId,ntId,tkId){

  nt.takes.forEach((t,i)=>t.nummer=i+1);

function tbSetSceneLabel(sceneId,label){
  const sc=as();if(!sc)return;
  tbInit(sc);
  sc.tonbericht.sceneLabels[sceneId]=label;
  save();
  /* Codename-Badges live aktualisieren ohne vollständiges Re-Render */

function tbAutoAdjustLabels(fromIdx,newNum){

  sc.scenes.slice(fromIdx).forEach(scene=>{

function renderTbProjekt(sc){
  const p=sc.tonbericht.projekt;
  const card=mk('div','tb-projekt-card');
  const hd=mk('div','tb-projekt-hd');
  const title=mk('div','tb-projekt-hd-title');title.textContent='🎬 Produktionskonfiguration';
  /* Vorschau des aktuellen Namensschemas */
  const preview=mk('div');
  preview.id='tb-proj-preview';
  preview.style.cssText='font-family:monospace;font-size:11px;color:var(--blue);opacity:.8';
  const updatePreview=()=>{
    const k=(p.kuerzel||'???').toUpperCase().slice(0,4)||'???';
    const exScene='01',exEi=(p.eiConvention==='numbers'?'1':'A'),exTk='T01';
    if(p.typ==='serie'&&String(p.episode||'').trim()){
      const ep=String(p.episode).trim().padStart(2,'0');
      preview.textContent=`${k}-${ep}-${exScene}-${exEi}${exTk}`;
    } else {
      preview.textContent=`${k}-${exScene}-${exEi}${exTk}`;
    }
  };
  updatePreview();
  hd.append(title,preview);
  card.appendChild(hd);

  const body=mk('div','tb-projekt-body');

  /* Kürzel */
  const kRow=mk('div','tb-projekt-row');
  const kLbl=mk('label');kLbl.textContent='Projektkürzel (3–4 Zeichen)';
  const kIn=mk('input','tb-input');
  kIn.placeholder='z.B. ORU';kIn.value=p.kuerzel||'';kIn.maxLength=4;
  kIn.style.textTransform='uppercase';kIn.style.letterSpacing='.1em';kIn.style.fontWeight='700';
  kIn.oninput=()=>{
    /* Nur bereinigen + speichern – KEIN renderTonbericht() → kein Focus-Verlust */
    const pos=kIn.selectionStart;
    const cleaned=kIn.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
    kIn.value=cleaned;
    /* Cursor-Position erhalten */
    try{kIn.setSelectionRange(Math.min(pos,cleaned.length),Math.min(pos,cleaned.length));}catch(e){}
    p.kuerzel=cleaned;
    save();
    updatePreview();
  };
  /* Beim Verlassen des Feldes Codenames in allen Szenen auffrischen */
  kIn.onblur=()=>renderTonbericht();
  kRow.append(kLbl,kIn);body.appendChild(kRow);

  /* Typ: Film / Serie */
  const typRow=mk('div','tb-projekt-row');
  const typLbl=mk('label');typLbl.textContent='Produktionstyp';
  const typSeg=mk('div','tb-seg-row');
  ['film','serie'].forEach(t=>{
    const btn=mk('button','tb-seg-btn'+(p.typ===t?' on':''));
    btn.textContent=t==='film'?'🎬 Film':'📺 Serie';
    btn.onclick=()=>tbUpdProjekt('typ',t);
    typSeg.appendChild(btn);
  });
  typRow.append(typLbl,typSeg);body.appendChild(typRow);

  /* Episodennummer (nur Serie) */
  if(p.typ==='serie'){
    const epRow=mk('div','tb-projekt-row');
    const epLbl=mk('label');epLbl.textContent='Episodennummer';
    const epIn=mk('input','tb-input');
    epIn.placeholder='z.B. 1';epIn.value=p.episode||'';epIn.type='number';epIn.min='1';
    epIn.style.maxWidth='100px';
    epIn.oninput=()=>tbUpdProjekt('episode',epIn.value);
    epRow.append(epLbl,epIn);body.appendChild(epRow);
  }

  /* Einstellungs-Namenskonvention */
  const convRow=mk('div','tb-projekt-row');
  const convLbl=mk('label');convLbl.textContent='Einstellungs-Nummerierung';
  const convSeg=mk('div','tb-seg-row');
  [['letters','A B C …'],['numbers','1 2 3 …']].forEach(([val,label])=>{
    const btn=mk('button','tb-seg-btn'+((p.eiConvention||'letters')===val?' on':''));
    btn.textContent=label;
    btn.onclick=()=>tbUpdProjekt('eiConvention',val);
    convSeg.appendChild(btn);
  });
  convRow.append(convLbl,convSeg);body.appendChild(convRow);

  card.appendChild(body);
  return card;
}

function renderTonbericht(){
  const wrap=g('tb-content'),sc=as(),p=ap();
  if(!wrap)return;
  if(!sc){
    wrap.innerHTML='<div style="padding:48px 24px;text-align:center;color:var(--label3);font-size:15px">🎚<br><br>Kein Drehbuch geladen.</div>';
    return;
  }
  tbInit(sc);

  /* Scroll-Position merken */
  const scrollY=wrap.scrollTop;
  wrap.innerHTML='';

  /* ─ Projektkonfiguration ─ */
  wrap.appendChild(renderTbProjekt(sc));

  /* ─ Drehtage-Sektion ─ */
  const dtSec=mk('div','tb-section');
  const dtHd=mk('div','tb-sec-hd');
  dtHd.innerHTML='<span>🎬 Drehtage & Produktionsdaten</span>';
  const addDtBtn=mk('button','tb-add-btn');addDtBtn.textContent='＋ Drehtag';
  addDtBtn.onclick=tbNewDrehtag;
  dtHd.appendChild(addDtBtn);
  dtSec.appendChild(dtHd);

  const dts=Object.values(p?.drehtage||{});
  if(dts.length===0){
    const empty=mk('div','tb-empty');empty.textContent='Noch keine Drehtage erfasst.';
    dtSec.appendChild(empty);
  } else {
    dts.forEach(dt=>dtSec.appendChild(renderTbDrehtag(dt)));
  }
  wrap.appendChild(dtSec);

  /* ─ Szenen ─ */
  sc.scenes.forEach(scene=>{
    const sd=tbGetSD(sc,scene.id);
    wrap.appendChild(renderTbScene(scene,sc,sd));
  });

  wrap.scrollTop=scrollY;
}

/* ── Szenen-Fortschritt ermitteln ────────────────────────────── */
function tbSceneProgress(sd){
  /* Alle Einstellungen quer über Haupt + Teilstücke */
  const allEis=tbAllEis(sd);
  if(!allEis.length)return'none';
  const totalTakes=allEis.reduce((s,e)=>s+e.takes.length,0);
  if(totalTakes===0)return'none';
  /* Nurtöne zählen auch */
  const nurtonTakes=(sd.nurtonTakes||[]).reduce((s,n)=>s+n.takes.length,0);
  const eisWithTakes=allEis.filter(e=>e.takes.length>0).length;
  if(eisWithTakes===allEis.length)return'done';
  return'progress';
}

function renderSceneCharsEditor(scene,sc,sd){
  const panel=mk('div','tb-scene-chars-panel');
  const hd=mk('div','tb-scene-chars-hd');
  const hdLbl=mk('span');hdLbl.textContent='Rollen in dieser Szene';
  const hasOverride=sd.sceneChars&&((sd.sceneChars.added||[]).length>0||(sd.sceneChars.removed||[]).length>0);
  const resetBtn=mk('button','tb-scene-char-reset');
  resetBtn.textContent='Zurücksetzen';
  resetBtn.title='Alle manuellen Änderungen rückgängig machen';
  resetBtn.style.display=hasOverride?'inline':'none';
  resetBtn.onclick=()=>tbResetSceneChars(scene.id);
  hd.append(hdLbl,resetBtn);
  panel.appendChild(hd);

  /* Aktuelle effektive Rollen als Chips */
  const effectiveChars=tbSceneCharsEffective(scene,sc,sd);
  const chipsWrap=mk('div','tb-scene-chars-chips');
  effectiveChars.forEach(name=>{
    const ch=sc.characters[name];
    const badge=mk('div','tb-scene-char-badge');
    badge.style.borderColor=ch?.color||'var(--sep)';
    badge.style.color=ch?.color||'var(--label)';
    const lbl=mk('span');lbl.textContent=name;
    const remBtn=mk('button','tb-scene-char-remove');
    remBtn.textContent='✕';remBtn.title=`${name} aus dieser Szene entfernen`;
    remBtn.onclick=()=>tbRemoveSceneChar(scene.id,name);
    badge.append(lbl,remBtn);
    chipsWrap.appendChild(badge);
  });
  if(effectiveChars.length===0){
    const empty=mk('span');empty.style.cssText='font-size:12px;color:var(--label4);font-style:italic';
    empty.textContent='Keine Rollen in dieser Szene';
    chipsWrap.appendChild(empty);
  }
  panel.appendChild(chipsWrap);

  /* Dropdown: verfügbare Rollen (aus Projekt-Charakterliste, noch nicht in Szene) */
  const available=Object.keys(sc.characters)
    .filter(n=>!sc.characters[n].hidden&&!effectiveChars.includes(n))
    .sort((a,b)=>a.localeCompare(b));
  if(available.length>0||true){  /* Immer anzeigen für manuelle Eingabe */
    const addRow=mk('div','tb-scene-char-add-row');
    /* Dropdown bekannter Charaktere */
    if(available.length>0){
      const sel=mk('select','tb-scene-char-sel');
      const placeholder=document.createElement('option');
      placeholder.value='';placeholder.textContent='– Bekannte Rolle –';
      sel.appendChild(placeholder);
      available.forEach(name=>{
        const o=document.createElement('option');o.value=name;o.textContent=name;
        sel.appendChild(o);
      });
      const addBtn=mk('button','tb-scene-char-add-btn');addBtn.textContent='＋';addBtn.title='Hinzufügen';
      addBtn.onclick=()=>{if(!sel.value)return;tbAddSceneChar(scene.id,sel.value);};
      addRow.append(sel,addBtn);
    }
    /* Freies Textfeld für neue Rollen */
    const manualIn=mk('input','tb-input');
    manualIn.placeholder='Neue Rolle manuell …';manualIn.style.flex='1';
    const manualBtn=mk('button','tb-scene-char-add-btn');manualBtn.textContent='＋ Neu';
    manualBtn.onclick=()=>{
      const name=manualIn.value.trim().toUpperCase();
      if(!name)return;
      const sc=as();if(!sc)return;
      /* Rolle in sc.characters anlegen falls noch nicht vorhanden */
      if(!sc.characters[name]){
        sc.characters[name]={color:COLS[Object.keys(sc.characters).length%COLS.length]};
        save();
      }
      tbAddSceneChar(scene.id,name);
      manualIn.value='';
    };
    manualIn.addEventListener('keydown',e=>{if(e.key==='Enter')manualBtn.click();});
    addRow.append(manualIn,manualBtn);
    panel.appendChild(addRow);
  }
  return panel;
}

function renderTbScene(scene,sc,sd){
  const p=ap();
  const drehtage=Object.values(p?.drehtage||{});
  const collapsed=S.ui.tbCollapsed?.scenes?.[scene.id]!==false;
  const scIdx=sc.scenes.findIndex(s=>s.id===scene.id);
  const currentLabel=tbSceneNum(sc,scene.id);
  const section=mk('div','tb-scene');
  section.dataset.sceneid=scene.id;
  /* Fortschritts-Klasse */
  const progress=tbSceneProgress(sd);
  if(progress==='done')section.classList.add('sc-done');
  else if(progress==='progress')section.classList.add('sc-progress');

  /* Header */
  const hd=mk('div','tb-scene-hd');
  hd.style.cursor='pointer';
  const title=mk('div','tb-scene-title');title.textContent=scene.title;title.title=scene.title;

  /* Szenennummer-Editor */
  const numWrap=mk('div','tb-scene-num-wrap');
  numWrap.onclick=e=>e.stopPropagation();
  const numInp=mk('input','tb-input tb-scene-num-inp');
  numInp.value=currentLabel;numInp.title='Szenennummer bearbeiten (nur diese Szene)';numInp.placeholder='01';
  numInp.onchange=()=>{
    const v=numInp.value.trim();if(!v)return;
    tbSetSceneLabel(scene.id,v); /* Nur diese Szene – keine anderen Szenen berührt */
  };
  /* Separater Button zum Weiter-Nummerieren */
  const adjBtn=mk('button','tb-scene-num-adj');
  adjBtn.textContent='↓ Folge-Szenen';
  adjBtn.title='Alle folgenden Szenen ab hier weiternummerieren';
  adjBtn.onclick=e=>{
    e.stopPropagation();
    const v=numInp.value.trim();
    const n=parseInt(v);
    if(isNaN(n)){showToast('Bitte erst eine Nummer eingeben','warn');return;}
    if(scIdx<sc.scenes.length-1){
      if(confirm(`Folgende ${sc.scenes.length-scIdx-1} Szene(n) ab Nr. ${n+1} nummerieren?`))
        tbAutoAdjustLabels(scIdx+1,n+1);
    }
  };
  numWrap.append(numInp,adjBtn);

  const dtSel=mk('select','tb-select tb-select-sm');
  dtSel.onclick=e=>e.stopPropagation(); /* Klick auf Select soll nicht Szene toggeln */
  const optNone=document.createElement('option');optNone.value='';optNone.textContent='– Drehtag –';dtSel.appendChild(optNone);
  drehtage.forEach(dt=>{
    const o=document.createElement('option');o.value=dt.id;
    o.textContent='Tag '+(dt.drehtag||'–')+(dt.datum?' · '+dt.datum:'');
    if(sd.drehtag_id===dt.id)o.selected=true;
    dtSel.appendChild(o);
  });
  dtSel.onchange=()=>tbAssignDrehtag(scene.id,dtSel.value);
  const colBtn=mk('button','tb-collapse-btn');
  colBtn.title=collapsed?'Szene aufklappen':'Szene einklappen';
  const colIcon=mk('span','tb-collapse-icon'+(collapsed?' collapsed':''));
  colIcon.textContent='▾';
  colBtn.appendChild(colIcon);
  colBtn.onclick=e=>{e.stopPropagation();tbToggleSceneCollapse(scene.id);};
  /* Fortschritts-Badge */
  const allEis=tbAllEis(sd);
  const totalTakes=allEis.reduce((s,e)=>s+e.takes.length,0);
  const badge=mk('span','tb-scene-progress-badge');
  if(progress==='done'){badge.textContent='✓ Fertig';}
  else if(progress==='progress'){
    const withTakes=allEis.filter(e=>e.takes.length>0).length;
    badge.textContent=`${withTakes}/${allEis.length} · ${totalTakes} Take${totalTakes!==1?'s':''}`;
  }
  hd.append(title,numWrap,dtSel,badge,colBtn);
  hd.onclick=()=>tbToggleSceneCollapse(scene.id);
  section.appendChild(hd);

  /* Body (collapsible) */
  const body=mk('div','tb-scene-body'+(collapsed?' collapsed':''));
  body.appendChild(renderSceneCharsEditor(scene,sc,sd));

  /* ── Haupt-Einstellungen ── */
  const eiList=mk('div','tb-ei-list');
  sd.einstellungen.forEach(ei=>eiList.appendChild(renderTbEi(scene,ei,sc,sd,0)));
  body.appendChild(eiList);
  const mainCtrl=mk('div','tb-ei-ctrl');
  const addBtn=mk('button','tb-pill-btn');addBtn.textContent='＋ Einstellung';addBtn.onclick=()=>tbAddEi(scene.id);
  const remBtn=mk('button','tb-pill-btn destr');remBtn.textContent='− Einstellung';remBtn.onclick=()=>tbRemEi(scene.id);
  mainCtrl.append(addBtn,remBtn);
  body.appendChild(mainCtrl);

  /* ── Teilstück-Gruppen ── */
  (sd.teilstuecke||[]).forEach(ts=>{
    const tsGroup=mk('div','tb-ts-group');
    const tsHd=mk('div','tb-ts-group-hd');
    const tsLbl=mk('span','tb-ts-group-lbl');tsLbl.textContent=`Teilstück T${ts.nummer}`;
    const tsDelBtn=mk('button','tb-pill-btn destr');tsDelBtn.textContent='✕ Teilstück';tsDelBtn.style.fontSize='11px';
    tsDelBtn.onclick=()=>tbRemTeilstueck(scene.id,ts.id);
    tsHd.append(tsLbl,tsDelBtn);tsGroup.appendChild(tsHd);
    const tsEiList=mk('div','tb-ei-list');
    (ts.einstellungen||[]).forEach(ei=>tsEiList.appendChild(renderTbEi(scene,ei,sc,sd,ts.nummer)));
    tsGroup.appendChild(tsEiList);
    const tsCtrl=mk('div','tb-ei-ctrl');
    const tsAddBtn=mk('button','tb-pill-btn');tsAddBtn.textContent='＋ Einstellung';tsAddBtn.onclick=()=>tbAddEiToTs(scene.id,ts.id);
    const tsRemBtn=mk('button','tb-pill-btn destr');tsRemBtn.textContent='− Einstellung';tsRemBtn.onclick=()=>tbRemEiFromTs(scene.id,ts.id);
    tsCtrl.append(tsAddBtn,tsRemBtn);tsGroup.appendChild(tsCtrl);
    body.appendChild(tsGroup);
  });

  /* ── + Teilstück Button ── */
  const tsAddRow=mk('div','tb-ei-ctrl');
  const addTsBtn=mk('button','tb-pill-btn');addTsBtn.innerHTML='＋ Teilstück hinzufügen';
  addTsBtn.style.color='var(--blue)';
  addTsBtn.onclick=()=>tbAddTeilstueck(scene.id);
  tsAddRow.appendChild(addTsBtn);
  body.appendChild(tsAddRow);

  /* ── Nurtöne-Sektion ── */
  body.appendChild(renderSceneNurtonSection(scene.id,sd));

  section.appendChild(body);
  return section;
}

function renderTbEi(scene,ei,sc,sd,tsNummer){
  const chars=tbSceneCharsEffective(scene,sc,sd);
  /* Einstellungen: Standard = OFFEN (nur explizit true = zugeklappt) */
  const collapsed=S.ui.tbCollapsed?.eis?.[ei.id]===true;
  const card=mk('div','tb-ei-card');
  card.dataset.eiid=ei.id;

  /* ── Header (immer sichtbar) ── */
  const hd=mk('div','tb-ei-hd');hd.style.cursor='pointer';
  const letterWrap=mk('div');
  letterWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0';
  const letter=mk('div','tb-ei-letter');letter.textContent=ei.letter;
  const codeName=mk('div','tb-ei-codename');
  codeName.textContent=tbBuildEiName(sc,scene.id,ei);
  letterWrap.append(letter,codeName);

  /* Figuren-Chips */
  const chips=mk('div','tb-char-chips');
  chips.onclick=e=>e.stopPropagation();
  chars.forEach(name=>{
    const ch=sc.characters[name];
    const active=ei.activeChars[name]!==false;
    const isOff=scene.lines.some(l=>l.character===name&&l.isOff);
    const chip=mk('button','tb-char-chip'+(active?'':' off'));
    chip.textContent=(name.length>12?name.slice(0,11)+'…':name)+(isOff?' ·off':'');
    if(ch&&active){chip.style.color=ch.color;chip.style.background=ch.color+'22';}
    chip.title=(active?'Abwählen: ':'Auswählen: ')+name;
    chip.onclick=()=>tbToggleChar(scene.id,ei.id,name);
    chips.appendChild(chip);
  });

  /* Collapse-Button */
  const colBtn=mk('button','tb-collapse-btn');
  colBtn.title=collapsed?'Einstellung aufklappen':'Einstellung einklappen';
  const colIcon=mk('span','tb-collapse-icon'+(collapsed?' collapsed':''));
  colIcon.textContent='▾';colBtn.appendChild(colIcon);
  colBtn.onclick=e=>{e.stopPropagation();tbToggleEiCollapse(ei.id);};

  hd.append(letterWrap,chips,colBtn);
  hd.onclick=()=>tbToggleEiCollapse(ei.id);
  card.appendChild(hd);

  /* ── Kanal-Chip-Zeile (immer sichtbar) ── */
  const TB_FIXED_MICS=['Boom 1','Boom 2','Plant'];
  const kanalRow=mk('div','tb-kanal-row');
  const kanalLbl=mk('span','tb-kanal-row-lbl');kanalLbl.textContent='Kanal'; /* kein Emoji */
  kanalRow.appendChild(kanalLbl);
  const kanalArr=Array.isArray(ei.kanal)?ei.kanal:[];
  TB_FIXED_MICS.forEach(mic=>{
    const chip=mk('button','tb-kanal-chip'+(kanalArr.includes(mic)?' on':''));
    chip.textContent=mic;
    chip.onclick=()=>tbToggleKanal(scene.id,ei.id,mic);
    kanalRow.appendChild(chip);
  });
  chars.forEach(name=>{
    const ch=sc.characters[name];
    const active=kanalArr.includes(name);
    const chip=mk('button','tb-kanal-chip'+(active?' on char-on':''));
    chip.textContent=name.length>12?name.slice(0,11)+'…':name;
    if(active&&ch){chip.style.color=ch.color;chip.style.borderColor=ch.color;chip.style.background=ch.color+'18';}
    chip.onclick=()=>tbToggleKanal(scene.id,ei.id,name);
    kanalRow.appendChild(chip);
  });
  card.appendChild(kanalRow);

  /* ── PU / Variante Flag-Zeile (immer sichtbar) ── */
  const flagRow=mk('div','tb-flag-row');
  const flagLbl=mk('span','tb-flag-lbl');flagLbl.textContent='Zusatz';
  const puBtn=mk('button','tb-flag-btn'+(ei.isPU?' on-pu':''));
  puBtn.textContent='PU – Pickup';
  puBtn.title='Als Pickup markieren – ändert den Dateinamen';
  puBtn.onclick=()=>tbToggleEiFlag(scene.id,ei.id,'isPU');
  const vBtn=mk('button','tb-flag-btn'+(ei.isVariante?' on-v':''));
  vBtn.textContent='v – Variante';
  vBtn.title='Als Variante markieren – ändert den Dateinamen';
  vBtn.onclick=()=>tbToggleEiFlag(scene.id,ei.id,'isVariante');
  const mosBtn=mk('button','tb-flag-btn'+(ei.isMOS?' on-mos':''));
  mosBtn.textContent='MOS';mosBtn.title='Mit Out Sound – Bild ohne Ton';
  mosBtn.onclick=()=>tbToggleEiFlag(scene.id,ei.id,'isMOS');
  const slomoBtn=mk('button','tb-flag-btn'+(ei.isSlowMo?' on-slomo':''));
  slomoBtn.textContent='SlowMo';slomoBtn.title='Slow Motion';
  slomoBtn.onclick=()=>tbToggleEiFlag(scene.id,ei.id,'isSlowMo');
  /* Teilstück */
  const tsWrap=mk('div','tb-ts-wrap');
  const tsLbl=mk('span','tb-ts-lbl');tsLbl.textContent='Teilstück T';
  const tsInp=mk('input','tb-input tb-ts-inp');
  tsInp.type='number';tsInp.min='0';tsInp.max='99';
  tsInp.value=ei.teilstueck||'';tsInp.placeholder='–';
  tsInp.title='Teilstück-Nummer (T1, T2 …) – wird an Szenennummer angehängt';
  tsInp.oninput=()=>tbSetTeilstueck(scene.id,ei.id,tsInp.value);
  tsWrap.append(tsLbl,tsInp);
  flagRow.append(flagLbl,puBtn,vBtn,mosBtn,slomoBtn,tsWrap);
  card.appendChild(flagRow);

  /* ── Collapsible Body: Takes ── */
  const body=mk('div','tb-ei-body'+(collapsed?' collapsed':''));
  ei.takes.forEach(tk=>body.appendChild(renderTbTake(scene.id,ei.id,ei.letter,tk,sc,sd)));
  card.appendChild(body);

  /* ── + Take immer sichtbar (außerhalb collapsed body) ── */
  const addTakeRow=mk('div','tb-add-take-row');
  const addTakeBtn=mk('button','tb-add-take-btn');
  addTakeBtn.style.cssText='border-radius:0 0 var(--r10) var(--r10);flex:1';
  addTakeBtn.textContent='＋ Take anlegen';
  addTakeBtn.onclick=()=>tbAddTake(scene.id,ei.id);
  const takeCountLbl=mk('span','tb-take-count');
  takeCountLbl.textContent=`${ei.takes.length} Take${ei.takes.length!==1?'s':''}`;
  takeCountLbl.style.padding='0 10px';
  addTakeRow.append(addTakeBtn);
  card.appendChild(addTakeRow);
  return card;
}

function tbTakeFilled(tk){
  /* Take erst zuklappen sobald eine Sternebewertung vergeben wurde */
  return tk.sterne>0;
}
function tbToggleTakeCollapse(tkId){
  if(!S.ui.tbCollapsed.takes)S.ui.tbCollapsed.takes={};
  const cur=S.ui.tbCollapsed.takes[tkId];
  /* Default: filled=collapsed, empty=expanded */
  S.ui.tbCollapsed.takes[tkId]=cur===false?true:false;
  renderTonbericht();
}

function renderTbTake(sceneId,eiId,eiLetter,tk,sc,sd){
  const p=ap();
  /* Collapse: gefüllte Takes sind standardmäßig zugeklappt */
  if(!S.ui.tbCollapsed.takes)S.ui.tbCollapsed.takes={};
  const filledDefault=tbTakeFilled(tk);
  const collapsed=tkId=>{
    const v=S.ui.tbCollapsed.takes[tkId];
    if(v===true)return true;
    if(v===false)return false;
    return filledDefault; /* default = filled→collapsed */
  };
  const isColl=collapsed(tk.id);
  const card=mk('div','tb-take-card'+(tk.isBest?' best':'')+(isColl?' is-collapsed':''));
  const eiList=sd?sd.einstellungen:[];
  const eiIdx=eiList.findIndex(e=>e.id===eiId);
  const tkIdx=eiList[eiIdx]?.takes.findIndex(t=>t.id===tk.id)??-1;
  const tkTotal=eiList[eiIdx]?.takes.length??1;

  /* ─ Take-Codename-Badge ─ */
  const eiObj=sd?sd.einstellungen.find(e=>e.id===eiId):null;
  const takeName=tbBuildTakeName(sc,sceneId,eiObj||eiLetter,tk.nummer);
  const nameRow=mk('div','tb-take-name-row');
  const nameBadge=mk('div','tb-take-name-badge');nameBadge.textContent=takeName;
  const copyBtn=mk('button','tb-copy-btn');copyBtn.textContent='⎘';copyBtn.title='Dateinamen kopieren';
  copyBtn.onclick=()=>tbCopyName(takeName,copyBtn);
  nameRow.append(nameBadge,copyBtn);
  card.appendChild(nameRow);

  /* ─ Header: Nr · Label · Sterne · Best · Löschen ─ */
  const hd=mk('div','tb-take-hd');
  const numBadge=mk('div','tb-take-num');
  numBadge.textContent='Take '+tk.nummer;
  /* Editierbares Label */
  const labelIn=mk('input','tb-input tb-take-label-inp');
  labelIn.placeholder='Bezeichnung …';labelIn.value=tk.label||'';
  labelIn.title='Take benennen (optional)';
  labelIn.oninput=()=>tbUpdTake(sceneId,eiId,tk.id,'label',labelIn.value);
  /* Sterne */
  const stars=mk('div','tb-stars');
  for(let i=1;i<=5;i++){
    const s=mk('button','tb-star'+(i<=tk.sterne?' on':''));s.textContent='★';
    const v=i;s.onclick=()=>tbSetSterne(sceneId,eiId,tk.id,v);
    stars.appendChild(s);
  }
  /* Best */
  const bestBtn=mk('button','tb-best-btn'+(tk.isBest?' on':''));
  bestBtn.innerHTML=tk.isBest?'🏆':'☆';
  bestBtn.title=tk.isBest?'Best Take aufheben':'Als Best Take markieren';
  bestBtn.onclick=()=>tbToggleBest(sceneId,eiId,tk.id);
  /* Löschen */
  const delBtn=mk('button','tb-del-btn');delBtn.textContent='✕';
  delBtn.title='Take löschen';
  delBtn.onclick=e=>{e.stopPropagation();if(!tk.isBest||confirm('Best Take löschen?'))tbDelTake(sceneId,eiId,tk.id);};
  hd.append(numBadge,labelIn,stars,bestBtn,delBtn);
  /* Klick auf Header → Take ein/ausklappen */
  hd.onclick=()=>tbToggleTakeCollapse(tk.id);
  card.appendChild(hd);

  /* ─ Take-Summary (sichtbar wenn eingeklappt) ─ */
  const sumRow=mk('div','tb-take-summary');
  if(tk.sterne>0){const s=mk('span','tb-sum-chip');s.textContent='★'.repeat(tk.sterne);sumRow.appendChild(s);}
  if(tk.dialog.verstaendlichkeit){
    const v=tk.dialog.verstaendlichkeit;
    const sc2=mk('span','tb-sum-chip '+(v==='gut'?'ok':v==='schlecht'?'issue':''));
    sc2.textContent=v==='gut'?'✓ Gut':v==='mittel'?'◑ Mittel':'✗ Schlecht';
    sumRow.appendChild(sc2);
  }
  const dlgIssues=Object.entries(tk.dialog).filter(([k,v])=>k!=='verstaendlichkeit'&&v);
  if(dlgIssues.length>0){const d=mk('span','tb-sum-chip issue');d.textContent=dlgIssues.length+' Kriterium';sumRow.appendChild(d);}
  if(tk.stoergeraeusche.length>0){const n=mk('span','tb-sum-chip noise');n.textContent='🔊 '+tk.stoergeraeusche.length;sumRow.appendChild(n);}
  if(tk.kommentar?.trim()){const c=mk('span','tb-sum-comment');c.textContent='"'+tk.kommentar.trim().slice(0,45)+(tk.kommentar.length>45?'…':'')+'"';sumRow.appendChild(c);}
  if(sumRow.children.length===0){const e=mk('span','tb-sum-chip');e.textContent='Leer';sumRow.appendChild(e);}
  card.appendChild(sumRow);

  /* ─ Steuerung: Reihenfolge + Verschieben ─ */
  const ctrlRow=mk('div','tb-take-ctrl-row');
  /* ↑ ↓ innerhalb Einstellung */
  const upBtn=mk('button','tb-sort-btn');upBtn.title='Take nach oben';upBtn.textContent='↑';
  upBtn.disabled=tkIdx<=0;
  upBtn.onclick=()=>tbReorderTake(sceneId,eiId,tk.id,-1);
  const dnBtn=mk('button','tb-sort-btn');dnBtn.title='Take nach unten';dnBtn.textContent='↓';
  dnBtn.disabled=tkIdx<0||tkIdx>=tkTotal-1;
  dnBtn.onclick=()=>tbReorderTake(sceneId,eiId,tk.id,1);
  ctrlRow.append(upBtn,dnBtn);
  /* Verschieben in andere Einstellung (nur wenn >1 Einstellung) */
  if(eiList.length>1){
    const moveLbl=mk('span','tb-move-lbl');moveLbl.textContent='→';
    const moveSel=mk('select','tb-select tb-move-sel');
    const optSelf=document.createElement('option');optSelf.value='';optSelf.textContent='Verschieben nach …';
    moveSel.appendChild(optSelf);
    eiList.forEach(ei2=>{
      if(ei2.id===eiId)return;
      const o=document.createElement('option');
      o.value=ei2.id;
      o.textContent='Einstellung '+ei2.letter+(ei2.kanal?.length?' · '+(Array.isArray(ei2.kanal)?ei2.kanal.join(', '):ei2.kanal):'');
      moveSel.appendChild(o);
    });
    moveSel.onchange=()=>{
      if(!moveSel.value)return;
      tbMoveTake(sceneId,eiId,tk.id,moveSel.value);
    };
    ctrlRow.append(moveLbl,moveSel);
  }
  card.appendChild(ctrlRow);

  /* ─ Collapsible Take-Body ─ */
  const takeBody=mk('div','tb-take-body');

  /* ─ Timecode entfernt — TC In/Out wurde entfernt ─ */

  /* ─ Dialog-Kriterien ─ */
  const dlgSec=mk('div','tb-criteria-section');
  const dlgHd=mk('div','tb-criteria-hd');dlgHd.innerHTML='🎙&nbsp; Dialog-Kriterien';
  dlgSec.appendChild(dlgHd);
  /* Verständlichkeit */
  const verstRow=mk('div','tb-verst-row');
  const verstLbl=mk('span','tb-crit-label');verstLbl.textContent='Verständlichkeit';
  verstRow.appendChild(verstLbl);
  [['gut','✓ Gut'],['mittel','◑ Mittel'],['schlecht','✗ Schlecht']].forEach(([v,label])=>{
    const btn=mk('button','tb-verst-btn'+(tk.dialog.verstaendlichkeit===v?' on-'+v:''));
    btn.textContent=label;
    btn.onclick=()=>{
      tk.dialog.verstaendlichkeit=tk.dialog.verstaendlichkeit===v?null:v;
      save();renderTonbericht();
    };
    verstRow.appendChild(btn);
  });
  dlgSec.appendChild(verstRow);
  /* Boolean Kriterien */
  const boolCrit=[
    ['textabweichung','Textabweichung'],['rascheln','Rascheln'],
    ['ueberlappen','Überlappen'],['versprecher','Versprecher'],
    ['atemgeraeusch','Atemgeräusch'],['hallecho','Hall / Echo'],['rauschen','Rauschen']
  ];
  const boolWrap=mk('div','tb-bool-wrap');
  boolCrit.forEach(([key,label])=>{
    const active=!!tk.dialog[key];
    const chip=mk('button','tb-crit-chip'+(active?' on':''));
    chip.textContent=label;
    chip.onclick=()=>{tk.dialog[key]=!tk.dialog[key];save();renderTonbericht();};
    boolWrap.appendChild(chip);
  });
  dlgSec.appendChild(boolWrap);
  takeBody.appendChild(dlgSec);

  /* ─ Störgeräusche ─ */
  const noiseSec=mk('div','tb-criteria-section');
  const noiseHd=mk('div','tb-criteria-hd');noiseHd.innerHTML='🔊&nbsp; Störgeräusche';
  noiseSec.appendChild(noiseHd);
  const allNoise=[...TB_DEFAULT_NOISE,...(p?.customNoise||[])];
  const noiseWrap=mk('div','tb-bool-wrap');
  allNoise.forEach(noise=>{
    const isCustom=(p?.customNoise||[]).includes(noise);
    const active=tk.stoergeraeusche.includes(noise);
    const chip=mk('button','tb-crit-chip'+(active?' on noise':''));
    chip.textContent=noise;
    chip.onclick=()=>tbToggleNoise(sceneId,eiId,tk.id,noise);
    if(isCustom){
      const wrap=mk('span');wrap.style.cssText='display:inline-flex;align-items:center;gap:2px';
      wrap.appendChild(chip);
      const delNoise=mk('button');
      delNoise.textContent='×';delNoise.title='Aus Liste entfernen';
      delNoise.style.cssText='background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 2px;line-height:1;opacity:.6';
      delNoise.onclick=e=>{e.stopPropagation();if(confirm(`"${noise}" aus der Liste entfernen?`))tbRemoveCustomNoise(noise);};
      wrap.appendChild(delNoise);
      noiseWrap.appendChild(wrap);
    } else {
      noiseWrap.appendChild(chip);
    }
  });
  noiseSec.appendChild(noiseWrap);
  /* Custom noise */
  const customRow=mk('div','tb-custom-noise-row');
  const customIn=mk('input','tb-input');
  customIn.placeholder='Eigenes Störgeräusch …';customIn.style.flex='1';
  const addCust=mk('button','tb-pill-btn');addCust.textContent='＋ Hinzufügen';
  addCust.onclick=()=>{
    const v=customIn.value.trim();if(!v)return;
    tbAddCustomNoise(sceneId,eiId,tk.id,v);customIn.value='';
  };
  customIn.addEventListener('keydown',e=>{if(e.key==='Enter')addCust.click();});
  customRow.append(customIn,addCust);
  noiseSec.appendChild(customRow);
  takeBody.appendChild(dlgSec);
  takeBody.appendChild(noiseSec);

  /* ─ Kommentar ─ */
  const komRow=mk('div','tb-kom-row');
  const komIn=mk('textarea','tb-input tb-kom');
  komIn.placeholder='Kommentar zum Take …';komIn.value=tk.kommentar||'';komIn.rows=2;
  komIn.oninput=()=>tbUpdTake(sceneId,eiId,tk.id,'kommentar',komIn.value);
  komRow.appendChild(komIn);
  takeBody.appendChild(komRow);
  card.appendChild(takeBody);
  return card;
}

function buildWordSpans(container,text,lineId,sc,q){
  if(!sc.wordMarkers)sc.wordMarkers={};
  /* Tokenize: Wörter + Leerzeichen getrennt erhalten */
  const tokens=text.split(/(\s+)/);
  let wi=0;
  tokens.forEach(tok=>{
    if(/^\s+$/.test(tok)){
      container.appendChild(document.createTextNode(tok));
      return;
    }
    const key=lineId+'_'+wi;
    const marked=!!sc.wordMarkers[key];
    const span=document.createElement('span');
    span.className='wm'+(marked?' on':'')+(S.mode==='w'?' clk':'');
    span.dataset.wkey=key;
    /* Suchbegriff-Highlight innerhalb des Worts */
    if(q&&tok.toLowerCase().includes(q.toLowerCase())){
      span.innerHTML=hilite(esc(tok),q);
    } else {
      span.textContent=tok;
    }
    container.appendChild(span);
    wi++;
  });
}

═══════════════════════════════════════════════════════════════ */

/* Basis-Name: Klammern, Zusätze und Sonderzeichen am Ende entfernen */
function charBaseName(name){
  return name
    .replace(/\s*\(.*?\)\s*$/, '')   /* ANNA (V.O.) → ANNA      */
    .replace(/\s*\[.*?\]\s*$/, '')   /* ANNA [NOTE] → ANNA      */
    .replace(/[\s:\.\,\-–—\/\\!'?]+$/, '') /* trailing specials  */
    .trim().toUpperCase();
}

/* Findet Gruppen mit gleichem Basis-Namen → Merge-Kandidaten */
function findMergeCandidates(sc){
  const groups={};
  Object.keys(sc.characters).forEach(name=>{
    const base=charBaseName(name);
    if(!base)return;
    if(!groups[base])groups[base]=[];
    groups[base].push(name);
  });
  return Object.values(groups)
    .filter(m=>m.length>1)
    .map(members=>{
      /* Kanonischer Name = der ohne Zusätze (kürzester nach Strip) */
      const canonical=members.reduce((a,b)=>
        charBaseName(a).length===charBaseName(b).length
          ? (a.length<=b.length?a:b) : a, members[0]);
      return {canonical, members};
    });
}

/* Führt Rollen zusammen: alle aliases werden zu canonical */
function mergeChars(sc, canonical, members){
  const aliases=members.filter(n=>n!==canonical);
  aliases.forEach(alias=>{
    /* 1. Alle Skript-Zeilen: Figurenname ersetzen */
    sc.scenes.forEach(scene=>{
      scene.lines.forEach(line=>{
        if(line.character===alias)line.character=canonical;
      });
    });
    /* 2. Nurtöne */
    if(sc.nurtons)sc.nurtons.forEach(n=>{if(n.character===alias)n.character=canonical;});
    /* 3. Tonbericht activeChars + kanal */
    if(sc.tonbericht?.sceneData){
      Object.values(sc.tonbericht.sceneData).forEach(sd=>{
        sd.einstellungen.forEach(ei=>{
          if(ei.activeChars&&alias in ei.activeChars){
            const was=ei.activeChars[alias];
            delete ei.activeChars[alias];
            if(!(canonical in ei.activeChars))ei.activeChars[canonical]=was;
            else ei.activeChars[canonical]=ei.activeChars[canonical]||was;
          }
          if(Array.isArray(ei.kanal)){
            const i=ei.kanal.indexOf(alias);
            if(i>=0){ei.kanal.splice(i,1);if(!ei.kanal.includes(canonical))ei.kanal.push(canonical);}
          }
        });
      });
    }
    /* 4. Charakter-Eintrag entfernen (Farbe vom canonical bleibt) */
    delete sc.characters[alias];
    /* 5. Filter zurücksetzen wenn alias aktiv war */
    if(S.ui.fc===alias)S.ui.fc=canonical;
  });
  /* canonical sicherstellen */
  if(!sc.characters[canonical])sc.characters[canonical]={color:COLS[0]};
  save();renderAll();openMod();
}

function openMod(){
  const sc=as(),wrap=g('mchars');

  /* ── AUTO-ERKANNTE MERGE-KANDIDATEN ──────────────────────── */
  const candidates=findMergeCandidates(sc);

    const ms=mk('div','merge-section');
    const mhd=mk('h4');mhd.innerHTML='⚡ Ähnliche Rollen erkannt';
    ms.appendChild(mhd);

    candidates.forEach(({canonical,members})=>{
      /* State für Kanonischen-Auswahl lokal in Closure */
      let chosenCanonical=canonical;
      const grp=mk('div','merge-group');

      const renderGroup=()=>{
        grp.innerHTML='';
        const namesRow=mk('div','merge-group-names');
        members.forEach(name=>{
          const badge=mk('button','merge-name-badge'+(name===chosenCanonical?' canonical':''));

          else badge.textContent=name;
          badge.title=name===chosenCanonical
            ?'Dieser Name wird behalten'

          namesRow.appendChild(badge);
        });
        grp.appendChild(namesRow);

        const hint=mk('div','merge-hint');
        hint.textContent=`★ = Hauptname der erhalten bleibt. Die anderen ${members.length-1} Variante(n) werden zusammengeführt.`;

          mergeChars(sc,chosenCanonical,members);

      [selA,selB].forEach(sel=>{
        const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);
      });
    });
    if(allNames.length>1)selB.selectedIndex=1;

    const mergeBtn=mk('button','merge-confirm-btn');
    mergeBtn.textContent='Zusammenführen';
    mergeBtn.style.marginTop='8px';
    mergeBtn.onclick=()=>{
      const a=selA.value,b=selB.value;
      if(a===b){showToast('Bitte zwei verschiedene Rollen wählen','warn');return;}
      /* A bleibt als Hauptname */
      if(!confirm(`"${b}" zusammenführen mit "${a}"?\n"${b}" wird entfernt und durch "${a}" ersetzt.\n\nDieser Vorgang kann nicht rückgängig gemacht werden.`))return;
      mergeChars(sc,a,[a,b]);
    };

    const row=mk('div','merge-row');row.style.gap='8px';
    const keepLbl=mk('span');keepLbl.style.cssText='font-size:12px;color:var(--label3);white-space:nowrap';
    keepLbl.textContent='Behalten:';
    const removeLbl=mk('span');removeLbl.style.cssText='font-size:12px;color:var(--label3);white-space:nowrap';
    removeLbl.textContent='→ löschen:';
    row.append(keepLbl,selA,removeLbl,selB);
    mm.appendChild(row);
    mm.appendChild(mergeBtn);
    ms2.appendChild(mm);
    wrap.appendChild(ms2);
  }

  /* ── SICHTBARE ROLLEN MIT FARBE ───────────────────────────── */
  const hdLbl=mk('h4');hdLbl.style.cssText='font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--label3);margin-bottom:10px';
  hdLbl.textContent='Farben & Sichtbarkeit';
  wrap.appendChild(hdLbl);

  const entries=[...Object.entries(sc.characters)]
    .sort((a,b)=>{ if(!!a[1].hidden!==!!b[1].hidden)return a[1].hidden?1:-1; return a[0].localeCompare(b[0]); });

  if(entries.some(([,ch])=>ch.hidden)){
    const hint=mk('p');hint.style.cssText='font-size:12px;color:var(--label3);margin-bottom:12px';
    hint.textContent='Ausgeblendete Rollen erscheinen nicht in der Filterleiste.';
    wrap.appendChild(hint);
  }

  entries.forEach(([name,ch])=>{
    const row=mk('div','crow');
    if(ch.hidden)row.style.opacity='.45';
    const eye=mk('button');
    eye.style.cssText='background:none;border:1px solid var(--sep);border-radius:6px;cursor:pointer;font-size:15px;padding:2px 6px;min-height:auto;flex-shrink:0';
    eye.textContent=ch.hidden?'🙈':'👁';
    eye.title=ch.hidden?'Wieder einblenden':'In Filterleiste ausblenden';
    eye.onclick=()=>{
      ch.hidden=!ch.hidden;
      if(S.ui.fc===name&&ch.hidden)S.ui.fc=null;
      save();renderScript();renderChips();openMod();
    };
    const lbl=mk('span');lbl.textContent=name;
    lbl.style.color=ch.hidden?'var(--label3)':ch.color;
    if(ch.hidden)lbl.style.textDecoration='line-through';
    const inp=document.createElement('input');inp.type='color';inp.value=ch.color;
    if(ch.hidden)inp.disabled=true;
    inp.oninput=e=>{const c=e.target.value;ch.color=c;lbl.style.color=c;syncCharColor(name,c);};
    inp.onchange=()=>{save();renderScript();renderChips();renderTree();};
    row.append(eye,lbl,inp);wrap.appendChild(row);
  });
  g('movl').classList.add('on');
}
function closeMod(){g('movl').classList.remove('on');}

/* Farbsynchronisation: ändert die Farbe einer Rolle in ALLEN Skripten des Projekts */
function syncCharColor(name,color){
  const proj=ap();if(!proj)return;
  Object.values(proj.scripts).forEach(s=>{
    if(s.characters[name])s.characters[name].color=color;
  });
}

/* ═══════════════════════════════════════════════════════════════
   BACKUP — Vollständige Projektdaten sichern und laden
   ---------------------------------------------------------------
   Export: alle Projekte → .json  (Szenen, Charaktere, Nurtöne,
           Aufnahme-Markierungen, Notizen — alles außer der PDF)
   Import: .json → Zusammenführen mit vorhandenen Daten
           Gleiche Projekt-ID → wird überschrieben
           Neue Projekt-ID   → wird hinzugefügt
═══════════════════════════════════════════════════════════════ */
function exportBackup(){
  const projCount=Object.keys(S.projects).length;
  if(!projCount){showToast('Keine Projekte zum Sichern.','warn');return;}
  const date=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const suggested=`cinescript_backup_${date}`;
  const name=prompt('Dateiname (ohne .json):',suggested);
  if(!name?.trim())return; /* Abbrechen */
  const safeName=name.trim().replace(/[/\\:*?"<>|]/g,'_'); /* ungültige Zeichen ersetzen */
  const payload={
    _app:'CineScript',_v:'cs_v4',
    _date:new Date().toISOString(),
    _projects:projCount,
    projects:S.projects
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=safeName+'.json';
  a.click();URL.revokeObjectURL(a.href);
  showToast(`✓ Gesichert als „${safeName}.json"`,'ok');
}

async function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);

    /* Validierung */
    if(!data.projects||typeof data.projects!=='object')
      throw new Error('Kein gültiges CineScript-Backup.');
    if(data._app&&data._app!=='CineScript')
      throw new Error('Datei wurde nicht von CineScript erstellt.');

    const incoming=Object.values(data.projects);
    if(!incoming.length){showToast('Backup enthält keine Projekte.','warn');e.target.value='';return;}

    /* Konflikte prüfen */
    const existing=Object.keys(S.projects);
    const overwrite=incoming.filter(p=>existing.includes(p.id));
    const fresh=incoming.filter(p=>!existing.includes(p.id));

    let msg=`${incoming.length} Projekt${incoming.length!==1?'e':''} gefunden:\n`;
    if(fresh.length)   msg+=`  + ${fresh.length} neu\n`;
    if(overwrite.length)msg+=`  ↺ ${overwrite.length} werden überschrieben\n`;
    msg+='\nImportieren?';
    if(!confirm(msg)){e.target.value='';return;}

    /* Zusammenführen */
    Object.assign(S.projects,data.projects);

    /* Aktives Projekt setzen falls nötig */
    if(!S.pid||!S.projects[S.pid]){
      S.pid=Object.keys(S.projects)[0]||null;S.sid=null;
    }
    save();renderAll();
    showToast(`✓ ${incoming.length} Projekt${incoming.length!==1?'e':''} importiert`,'ok');
  }catch(err){
    showToast('Import fehlgeschlagen: '+(err.message||err),'err');
  }
  e.target.value='';
}
const csvF=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
function expStatus(){
  const sc=as(),p=ap();if(!sc){alert('Kein Drehbuch.');return;}
  let out=`AUFNAHMESTATUS — ${p?.name||''} · ${sc.name}\n${'═'.repeat(52)}\n\n`;
  let tot=0,rec=0;
  sc.scenes.forEach(s=>{
    const d=s.lines.filter(l=>l.type==='dialogue');
    const r=d.filter(l=>sc.recorded[l.id]).length;
    tot+=d.length;rec+=r;
    out+=`${s.title}\n  ${r}/${d.length} (${d.length?Math.round(r/d.length*100):0}%)\n`;
    if(sc.notes[s.id]?.trim())out+=`  📝 ${sc.notes[s.id].trim()}\n`;
    d.filter(l=>!sc.recorded[l.id]).slice(0,4).forEach(l=>{out+=`  ○ [${l.character}] ${l.text.slice(0,60)}\n`;});
    out+='\n';
  });
  out+=`${'─'.repeat(52)}\nGESAMT: ${rec}/${tot} (${tot?Math.round(rec/tot*100):0}%)\n`;
  dl(out,'aufnahmestatus.txt');
}
function expNurtons(typ){
  const sc=as();if(!sc)return;
  const nn=(sc.nurtons||[]).filter(n=>n.type===typ);
  let csv=typ==='dialog'?'Nr;Szene;Rolle;Dialog;Typ;Status;Notiz\n':'Nr;Szene;Geräusch;Referenz;Status;Notiz\n';
  nn.forEach((n,i)=>{
    if(typ==='dialog')csv+=`${i+1};${csvF(n.sceneTitle)};${csvF(n.character)};${csvF(n.text)};${csvF((n.auto?'AUTO':'MARKER')+(n.isOff?' OFF':''))};${csvF(n.status)};${csvF(n.note)}\n`;
    else csv+=`${i+1};${csvF(n.sceneTitle)};${csvF(n.text)};${csvF(n.refText)};${csvF(n.status)};${csvF(n.note)}\n`;
  });
  dl(csv,`nurtöne_${typ}.csv`);
}
function dl(text,name){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
async function wake(){if('wakeLock'in navigator)try{await navigator.wakeLock.request('screen');}catch{}}

/* UTILS */
const g=id=>document.getElementById(id);
const mk=(tag,cls='')=>{const e=document.createElement(tag);if(cls)e.className=cls;return e;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hilite=(h,q)=>h.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>');
function loading(on,m=''){g('loading').classList.toggle('on',on);if(m)setMsg(m);}
